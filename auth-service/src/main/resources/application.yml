# ==========================================
# AUTH SERVICE - Bootstrap Configuration
# ==========================================
# Ce fichier contient uniquement la config de démarrage
# Toute la config métier est dans config-repo/dev/
# ==========================================

spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: "optional:configserver:http://localhost:8888"
    fail-fast: false
    retry:
      max-attempts: 6
      initial-interval: 1000
      multiplier: 1.1
      max-interval: 2000

server:
  port: 8082

# ==========================================
# FALLBACK CONFIGURATION
# ==========================================
# Utilisé uniquement si config-server est indisponible
# ==========================================

# Fallback datasource
spring.datasource:
  url: ${AUTH_DB_URL}
  username: ${AUTH_DB_USERNAME}
  password: ${AUTH_DB_PASSWORD}
  driver-class-name: com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa:
  hibernate:
    ddl-auto: update
  show-sql: true
  properties:
    hibernate:
      dialect: org.hibernate.dialect.MySQLDialect
      format_sql: true

# Gateway configuration
gateway:
  url: ${GATEWAY_URL:http://localhost:8081}

# Fallback management
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
