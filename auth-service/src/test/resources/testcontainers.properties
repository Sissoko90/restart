# ==========================================================
# Testcontainers - auth-service
# ==========================================================
# Docker 29 refuse les versions d'API antérieures à 1.44 et répond HTTP 400
# sur /info. Le client embarqué par Testcontainers en négocie une plus
# ancienne : sans cette ligne, le diagnostic affiché est « Could not find a
# valid Docker environment », ce qui oriente vers une fausse piste — le démon
# répond, il refuse simplement la version demandée.
#
# À relever si un démon plus ancien devait être pris en charge.
api.version=1.44
