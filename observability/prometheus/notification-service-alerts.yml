# ============================================================================
# notification-service — regles d'alerte
# ============================================================================
# Ce service n'etait PAS collecte par Prometheus : ses six metriques etaient
# emises par du code qui tourne, et lues par personne. Le job de scrape a ete
# ajoute en meme temps que ce fichier — une alerte sur un service non scrape ne
# se declenche jamais, et rien ne le signale : l'expression PromQL rend un
# ensemble vide, ce qui n'est pas une erreur.
#
# Les noms de series employes ici sont ceux que Micrometer EXPOSE, et non les
# noms declares en Java. Micrometer renomme : les points deviennent des
# soulignes. `MetriquesDesAlertesTest` verifie que chaque serie interrogee ici
# est bien emise par du code du depot.
#
# ----------------------------------------------------------------------------
# CE QUI N'A PAS DE REGLE, ET POURQUOI
# ----------------------------------------------------------------------------
# notification_remises_total — une remise qui echoue est du trafic NORMAL : un
#   WebSocket sans session ouverte, un canal SMS desactive en developpement.
#   Une alerte dessus se declencherait en permanence, et serait donc ignoree.
#   Ce qui merite une alerte est la notification critique ENTIEREMENT perdue,
#   ci-dessous.
#
# notification_websocket_sessions — une jauge de sessions ouvertes n'a pas de
#   seuil utile : zero est normal la nuit, et un pic n'est pas un incident.
#   Elle sert aux panneaux, pas aux alertes.
#
# notification_traitement_duree — a garder pour plus tard. Un seuil pose
#   maintenant serait devine : ce service n'a pas encore de trafic reel, et une
#   alerte calibree au hasard apprend seulement a ne plus la lire.

groups:
  - name: notification-service-depense
    rules:
      # ------------------------------------------------------------------
      # Plafond de depense SMS atteint
      # ------------------------------------------------------------------
      # L'evenement que personne d'autre ne signalera. Des utilisateurs ne
      # recoivent plus leur code, et la cause n'est pas une panne mais une
      # limite voulue : aucune autre alerte ne se declenchera, et le service
      # repondra 200 a chaque demande.
      #
      # Severite `critical` : un code de verification qui ne part pas est une
      # impossibilite de se connecter.
      #
      # `> 0` et non un seuil : le premier refus est deja l'information. Soit le
      # plafond est trop bas et il faut le relever, soit quelque chose consomme
      # anormalement — dans les deux cas il faut regarder tout de suite.
      - alert: PlafondDepenseSmsAtteint
        expr: increase(sms_plafond_atteint_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
          service: notification-service
        annotations:
          summary: "Plafond journalier de SMS atteint"
          description: >-
            {{ $value | printf "%.0f" }} envois de SMS ont ete refuses par le
            plafond journalier sur les 15 dernieres minutes. Les codes de
            verification ne partent plus. Verifier sms.plafond-journalier et le
            solde chez le fournisseur avant de relever le plafond : un plafond
            atteint peut aussi signaler une boucle qui consomme.

  - name: notification-service-remises
    rules:
      # ------------------------------------------------------------------
      # Une notification CRITIQUE entierement perdue
      # ------------------------------------------------------------------
      # Compteur distinct des remises, precisement pour que cette alerte soit
      # ecrivable. Une CRITIQUE dont AUCUN canal n'a abouti est un code de
      # verification ou une alerte de securite que personne n'a recu.
      - alert: NotificationCritiquePerdue
        expr: increase(notification_critiques_perdues_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
          service: notification-service
        annotations:
          summary: "Notification critique perdue sur tous les canaux"
          description: >-
            {{ $value | printf "%.0f" }} notification(s) critique(s) du service
            {{ $labels.emetteur }} n'ont abouti sur AUCUN canal en 10 minutes.
            Code de verification ou alerte de securite non delivre.

      # ------------------------------------------------------------------
      # Rafale de demandes rejetees
      # ------------------------------------------------------------------
      # Un rejet isole est une demande mal formee d'un service appelant, et ne
      # merite pas de reveiller quelqu'un. Une rafale signale un emetteur qui
      # vient de regresser, ou un contrat d'evenement qui a change d'un cote
      # seulement.
      #
      # Severite `warning` : rien n'est perdu pour l'utilisateur final tant que
      # l'emetteur n'est pas sur un chemin critique.
      - alert: DemandesDeNotificationRejetees
        expr: sum(rate(notification_rejets_total[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
          service: notification-service
        annotations:
          summary: "Demandes de notification rejetees en rafale"
          description: >-
            Plus de 0,2 rejet par seconde depuis 10 minutes. Un service emetteur
            publie des demandes que notification-service refuse avant
            traitement — verifier le motif porte par l'etiquette `motif`.

  # ==========================================================================
  # Etat des canaux et des dependances sortantes
  # ==========================================================================
  - name: notification-service-canaux
    rules:
      # ------------------------------------------------------------------
      # Un canal qui FONCTIONNAIT ne fonctionne plus
      # ------------------------------------------------------------------
      # L'expression compare l'etat courant a celui d'il y a une heure, et
      # c'est tout l'interet.
      #
      # Une alerte sur `notification_canal_actif == 0` serait inutilisable : le
      # SMS est coupe en developpement, le push attend son fichier Firebase.
      # Elle se declencherait en permanence sur une CONFIGURATION, donc elle
      # serait mise en sourdine, et le jour ou un canal tomberait vraiment
      # personne ne le verrait.
      #
      # Ici, seule la BASCULE declenche. Un canal volontairement coupe reste a
      # zero des deux cotes de la comparaison et ne dit rien.
      #
      # Le cas reel que cela couvre : le canal PUSH s'est declare ACTIF sans
      # pouvoir envoyer — `FirebaseOptions` sans `projectId` — et seul le
      # journal de demarrage le disait. Une fois corrige, un fichier
      # d'identifiants retire ou expire produirait exactement cette bascule.
      - alert: CanalDeNotificationTombe
        expr: notification_canal_actif == 0 and notification_canal_actif offset 1h == 1
        for: 5m
        labels:
          severity: critical
          service: notification-service
        annotations:
          summary: "Le canal {{ $labels.canal }} ne peut plus remettre"
          description: >-
            Le canal {{ $labels.canal }} etait en mesure de remettre il y a une
            heure et ne l'est plus depuis au moins 5 minutes. Les demandes qui
            l'empruntent sont REFUSEES, pas mises en attente. Verifier la
            configuration du canal dans /actuator/health, section
            canauxDeRemise.

      # ------------------------------------------------------------------
      # Aucun canal ne peut plus remettre
      # ------------------------------------------------------------------
      # Sans condition de bascule, celle-la : zero canal actif n'est jamais une
      # configuration voulue. Le service repondrait 200 a chaque demande et ne
      # remettrait rien.
      - alert: AucunCanalDeNotificationActif
        expr: sum(notification_canal_actif) == 0
        for: 2m
        labels:
          severity: critical
          service: notification-service
        annotations:
          summary: "Aucun canal de notification n'est actif"
          description: >-
            Les quatre canaux sont inactifs. Aucune notification ne peut partir,
            quel que soit le canal demande : ni code de verification, ni alerte
            de securite. Cet etat est aussi rendu par /actuator/health, qui
            passe DOWN sur l'indicateur canauxDeRemise.

      # ------------------------------------------------------------------
      # Un disjoncteur sortant est ouvert
      # ------------------------------------------------------------------
      # Ouvert signifie que l'appel n'est PLUS TENTE : le fournisseur a echoue
      # au-dela du seuil et le disjoncteur refuse vite pour ne pas occuper les
      # threads de boundedElastic — qui portent aussi les OTP.
      #
      # `for: 2m` et non 0 : le disjoncteur passe par un etat semi-ouvert et se
      # referme seul si le fournisseur revient. Alerter a la seconde produirait
      # du bruit sur un hoquet.
      - alert: DisjoncteurSortantOuvert
        expr: >-
          resilience4j_circuitbreaker_state{state="open",
          name=~"afriksms|smtp-ordinaire|smtp-critique|fcm"} == 1
        for: 2m
        labels:
          severity: warning
          service: notification-service
        annotations:
          summary: "Disjoncteur {{ $labels.name }} ouvert"
          description: >-
            Les appels vers {{ $labels.name }} ne sont plus tentes depuis au
            moins 2 minutes. Les remises par ce chemin sont comptees en ECHOUE
            et seront reessayees par la reprise. Si le disjoncteur est
            smtp-critique, les alertes de securite ne partent plus.

  # ==========================================================================
  # Le moteur de modeles
  # ==========================================================================
  - name: notification-service-modeles
    rules:
      # ------------------------------------------------------------------
      # Les surcharges n'ont JAMAIS ete lues
      # ------------------------------------------------------------------
      # Distinct de « lues il y a longtemps », et la distinction porte une
      # cause differente : la tache part a initialDelay = 0, donc pendant
      # l'initialisation du contexte — le moment ou la base a le plus de
      # chances de ne pas etre prete.
      #
      # Consequence : les corrections poussees par PUT /api/v1/admin/modeles ne
      # s'appliquent pas, et le fichier versionne sert seul. Le service remet
      # normalement, ce qui rend la panne invisible sans cette regle.
      - alert: SurchargesDeModelesJamaisLues
        expr: notification_modeles_derniere_lecture_secondes == -1
        for: 5m
        labels:
          severity: warning
          service: notification-service
        annotations:
          summary: "Les surcharges de modeles n'ont jamais ete lues"
          description: >-
            Aucune lecture des surcharges n'a abouti depuis le demarrage de
            cette instance. Les corrections de texte poussees par
            PUT /api/v1/admin/modeles ne s'appliquent pas : seul le fichier
            modeles-notification.properties sert.

      # ------------------------------------------------------------------
      # Le rechargement s'est arrete
      # ------------------------------------------------------------------
      # Le rechargement degrade EN SILENCE : si la base refuse, l'instantane
      # precedent reste en vigueur et la methode rend sa taille comme si de
      # rien n'etait. Le nombre de surcharges ne bouge donc pas — exactement
      # comme quand personne n'a rien modifie.
      #
      # 300 s = cinq fois l'intervalle par defaut de 60 s. Le meme multiple que
      # l'indicateur de sante, pour que les deux ne se contredisent pas.
      - alert: SurchargesDeModelesFigees
        expr: notification_modeles_derniere_lecture_secondes > 300
        for: 5m
        labels:
          severity: warning
          service: notification-service
        annotations:
          summary: "Le rechargement des surcharges de modeles est arrete"
          description: >-
            La derniere lecture reussie date de
            {{ $value | printf "%.0f" }} secondes. Les surcharges en vigueur
            sont figees : une correction poussee par l'API ne sera pas vue.
            Verifier l'acces a la table surcharge_de_modele et la planification
            (@Scheduled exige @EnableScheduling).

  # ==========================================================================
  # Le compte d'expedition critique
  # ==========================================================================
  - name: notification-service-courriel
    rules:
      # ------------------------------------------------------------------
      # Les CRITIQUES partent du mauvais compte
      # ------------------------------------------------------------------
      # Le repli SAUVE le message, et c'est exactement ce qui le rend invisible :
      # l'appelant recoit « remis », la personne recoit son courriel, et le
      # compte dedie reste casse indefiniment.
      #
      # Le cas est reel. Mesure du 2026-11-10 : le compte critique etait REFUSE
      # par le serveur — identifiants invalides — pendant que le compte
      # ordinaire s'authentifiait. Les SEULS messages concernes etaient donc les
      # alertes de securite et les codes de verification, c'est-a-dire ce que le
      # compte dedie existe pour proteger.
      #
      # `> 0` et non un seuil : le premier repli est deja l'information. Un
      # second compte qui echoue une fois echouera a chaque fois — ses
      # identifiants ne se reparent pas d'eux-memes.
      - alert: CourrielCritiqueReplieSurLOrdinaire
        expr: increase(notification_courriel_repli_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
          service: notification-service
        annotations:
          summary: "Le compte d'expedition critique est indisponible ({{ $labels.cause }})"
          description: >-
            {{ $value | printf "%.0f" }} notification(s) CRITIQUE(S) sont
            reparties par le compte ordinaire sur les 15 dernieres minutes, le
            compte dedie ayant echoue avec {{ $labels.cause }}. Les messages
            ARRIVENT, mais depuis un compte dont la reputation d'expedition
            n'est pas protegee : un courriel marque indesirable parce que le
            trafic ordinaire a sature ce compte est un code que personne ne
            recoit. Verifier CRITICAL_MAIL_USERNAME et CRITICAL_MAIL_PASSWORD.
