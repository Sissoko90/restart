[smtp]
enabled = true
host = smtp.gmail.com:587
user = noreply@abdatytch.com
# Mot de passe à configurer via variable d'environnement GF_SMTP_PASSWORD
password = """
from_address = noreply@abdatytch.com
from_name = Grafana Gateway Alerts
skip_verify = false
startTLS_policy = MandatoryStartTLS

[alerting]
enabled = true
execute_alerts = true
max_attempts = 3
min_interval_seconds = 10

[unified_alerting]
enabled = true
execute_alerts = true
evaluation_timeout = 30s
max_attempts = 3
min_interval = 10s

[unified_alerting.screenshots]
capture = true
capture_timeout = 10s
max_concurrent_screenshots = 5

[log]
mode = console file
level = info

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
protocol = http
http_port = 3000
domain = localhost
root_url = http://localhost:3000

[security]
# Ces trois valeurs sont les DEFAUTS LIVRES PAR GRAFANA, publiques et
# documentees — pas des secrets engendres pour ce projet. Les composes les
# surchargent deja par GF_SECURITY_ADMIN_USER et GF_SECURITY_ADMIN_PASSWORD,
# qui ont priorite sur ce fichier.
#
# A CHANGER AVANT TOUTE MISE EN LIGNE : secret_key chiffre les mots de passe
# des sources de donnees de Grafana. Le laisser a sa valeur par defaut revient
# a ne pas les chiffrer, puisque la cle est connue de tous. Le poser par
# l'environnement, via GF_SECURITY_SECRET_KEY, et non ici.
admin_user = admin
admin_password = admin
secret_key = SW2YcwTIb9zpOOhoPsMm
disable_gravatar = false
