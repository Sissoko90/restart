# ==========================================================
# Valeurs par défaut du socle partagé
# ==========================================================
# Ces défauts vivent ici, et non dans des annotations @Value, pour
# qu'aucune adresse ne soit écrite en dur dans le code Java. Ils sont
# chargés avec une précédence INFÉRIEURE à application.yml : la
# configuration d'un service ou du config-server les remplace toujours.
#
# Leur raison d'être : permettre à un service de démarrer même si la
# configuration centralisée n'est pas encore disponible. Sans défaut,
# une clé manquante empêchait le démarrage.
# ==========================================================

# Autorité de signature JWT. Le chemin est celui de la spécification
# (RFC 8615, « well-known URI ») ; seul l'hôte change selon l'environnement.
jwt.jwks.url=http://localhost:8088/dev/.well-known/jwks.json

# Rafraîchissement périodique : permet la rotation de clés sans redéploiement.
jwt.jwks.refresh-interval-seconds=300

# Réessais au démarrage, avec temporisation exponentielle.
jwt.jwks.retry-attempts=5
