# ==========================================================
# Proprietes de test - notification-service
# ==========================================================
# Le test `contextLoads` ne doit pas exiger une infrastructure vivante.
# Meme forme que setting-service, quotas-service et les autres : on exclut les
# auto-configurations qui refusent de demarrer sans leur dependance.
#
# A REMPLACER PAR TESTCONTAINERS le jour ou ce service aura de vrais tests sur
# ses depots. La limite est connue et inscrite en memoire du projet : avec
# R2DBC desactive, une colonne manquante reste invisible jusqu'au demarrage
# reel. Ce fichier rend le test de contexte executable, il ne prouve pas que le
# schema est juste.
# ==========================================================

spring:
  autoconfigure:
    exclude:
      # R2DBC : sans URL, le ConnectionPool refuse de s'instancier, et son
      # indicateur de sante fait tomber tout le point d'entree actuator.
      - org.springframework.boot.r2dbc.autoconfigure.R2dbcAutoConfiguration
      - org.springframework.boot.data.r2dbc.autoconfigure.R2dbcDataAutoConfiguration
      - org.springframework.boot.data.r2dbc.autoconfigure.R2dbcRepositoriesAutoConfiguration
      # Flyway ouvrirait une connexion JDBC au demarrage.
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

  # Le serveur de configuration et Consul ne tournent pas pendant les tests.
  cloud:
    config:
      enabled: false
    consul:
      enabled: false
      discovery:
        enabled: false

  # Une adresse d'expediteur est posee ICI, et non laissee vide.
  #
  # La valeur par defaut de production est vide a dessein — un expediteur
  # invente ferait rejeter les courriels. Mais un test qui verifie le REFUS
  # d'envoyer faute d'expediteur doit pouvoir distinguer « non configure » de
  # « configure ». D'ou une valeur explicite, sur un domaine reserve aux
  # exemples par la RFC 2606 : .test ne resout jamais.
  mail:
    host: localhost
    port: 1025

  # Le decodeur JWT doit EXISTER, meme si rien ne le joint.
  #
  # SecurityConfig declare un serveur de ressources OAuth2, donc Spring exige un
  # ReactiveJwtDecoder au demarrage. Sans ces proprietes — qui vivent dans
  # config-repo, non charge en test — le contexte echoue sur « No qualifying
  # bean of type ReactiveJwtDecoder ».
  #
  # L'URL n'est PAS appelee au demarrage : NimbusReactiveJwtDecoder va chercher
  # les cles a la premiere verification. Le contexte se charge donc sans serveur
  # JWKS vivant, et aucun test de contexte ne depend du reseau.
  #
  # Le domaine est en .test, reserve aux exemples par la RFC 2606 : il ne resout
  # jamais, donc une requete partie par erreur echoue vite au lieu d'atteindre
  # un hote reel.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost.test/dev/.well-known/jwks.json

notification:
  email:
    from: notifications@example.test
    reply-to: notifications@example.test
