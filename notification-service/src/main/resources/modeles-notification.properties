# ==========================================================
# Modeles de notification
# ==========================================================
# Forme des cles :
#
#   <modele>.<canal>.sujet     variante propre a un canal
#   <modele>.<canal>.corps
#   <modele>.sujet             repli, tous canaux
#   <modele>.corps
#
# Le canal est en minuscules : courriel, sms, in_app, push, websocket.
#
# POURQUOI DES VARIANTES PAR CANAL : un SMS tient en 160 caracteres, un
# courriel non. Un seul texte pour les deux obligerait a choisir le plus
# contraint, donc a appauvrir le courriel.
#
# Les variables s'ecrivent {nomDeLaVariable} et sont substituees
# LITTERALEMENT, en un seul passage. Une valeur contenant elle-meme des
# accolades reste donc du texte : aucune evaluation, donc aucune injection.
#
# Un modele demande et absent de ce fichier n'envoie RIEN et remonte REFUSE
# dans le compte rendu. C'est volontaire : un message vide est pire qu'un
# message absent, parce qu'il fait croire a l'emetteur qu'il a notifie.
# ==========================================================

# ----------------------------------------------------------
# Projets — emis par interface-service
# ----------------------------------------------------------
projet.cree.sujet=Votre projet {nomDuProjet} est cree
projet.cree.corps=Votre projet {nomDuProjet} vient d'etre cree.
projet.cree.sms.corps=Projet {nomDuProjet} cree.

projet.supprime.sujet=Votre projet {nomDuProjet} a ete supprime
projet.supprime.corps=Votre projet {nomDuProjet} a ete supprime. Le quota correspondant vous est restitue.
projet.supprime.sms.corps=Projet {nomDuProjet} supprime.

# ----------------------------------------------------------
# Securite — emis par auth-service et interface-service
# ----------------------------------------------------------
# Ces modeles ne nomment NI le nouveau contact NI l'ancien.
#
# Raison inscrite en memoire du projet : prevenir la nouvelle adresse ne
# previent que l'attaquant. L'alerte doit dire QU'UN changement a eu lieu, pas
# lequel — sans quoi un courriel intercepte confirme a l'attaquant que son
# changement a pris effet.
securite.contact-modifie.sujet=Une modification de vos coordonnees
securite.contact-modifie.corps=Les coordonnees de votre compte ont ete modifiees le {date}. Si vous n'etes pas a l'origine de cette operation, contactez immediatement le support.
securite.contact-modifie.sms.corps=Vos coordonnees ont ete modifiees le {date}. Si ce n'est pas vous, contactez le support.

securite.mot-de-passe-modifie.sujet=Votre mot de passe a ete modifie
securite.mot-de-passe-modifie.corps=Le mot de passe de votre compte a ete modifie le {date}. Si vous n'etes pas a l'origine de cette operation, contactez immediatement le support.

# Le code n'apparait QUE dans le corps, jamais dans le sujet : un sujet
# s'affiche sur un ecran verrouille et dans les apercus de notification.
securite.code-de-verification.sujet=Votre code de verification
securite.code-de-verification.corps=Votre code de verification est {code}. Il expire dans {minutes} minutes. Ne le communiquez a personne.
securite.code-de-verification.sms.corps=Code : {code} (valable {minutes} min). Ne le communiquez a personne.

# ----------------------------------------------------------
# Quotas — emis par quotas-service
# ----------------------------------------------------------
quota.seuil-atteint.sujet=Vous approchez de votre limite
quota.seuil-atteint.corps=Vous avez consomme {pourcentage}% de votre quota de {ressource}.

# ==========================================================
# Modeles venus d'auth-service
# ==========================================================
# auth-service tient son propre moteur de modeles, adosse a la table
# message_templates et modifiable par MessageTemplateController. Son enum
# TemplateType compte cinq valeurs :
#
#   SMS_VERIFICATION      EMAIL_VERIFICATION
#   SMS_PASSWORD_RESET    EMAIL_PASSWORD_RESET
#                         EMAIL_WELCOME
#
# CE NOMMAGE MELANGE LE CANAL ET L'OBJET. SMS_VERIFICATION et
# EMAIL_VERIFICATION sont le MEME message sur deux canaux : les separer en deux
# types oblige a tenir deux textes d'accord, et le jour ou l'un change l'autre
# reste. Avec (modele, canal), l'objet est nomme une fois et le canal n'est
# qu'une variante — avec un repli commun quand elle n'existe pas.
#
# Les textes ci-dessous sont ceux de DataSeeder, mot pour mot. Les porter ici
# est le PREALABLE au retrait du moteur d'auth-service : tant qu'ils n'existent
# que la-bas, cesser de composer chez l'appelant produirait « modele
# introuvable » — un refus visible, mais un code que personne ne recoit.
#
# UneSeuleSourceDesModelesTest verifie que les cinq ont bien leur contrepartie.

# --- Code de verification : AUCUNE cle ajoutee, et c'est le point ---
#
# securite.code-de-verification existe DEJA plus haut (lignes 55-57), et son
# texte est MEILLEUR que celui d'auth-service sur un point de securite : il dit
# « Ne le communiquez a personne ». Le texte d'auth-service ne le dit pas.
#
# Porter les cinq modeles « mot pour mot » aurait donc RETIRE un avertissement
# de securite — et en silence, puisqu'un fichier .properties accepte une cle
# dupliquee et garde la DERNIERE. C'est exactement ce qui s'est produit a
# l'ecriture de ce bloc, et c'est la comparaison des deux versions qui l'a
# montre.
#
# Sa variante SMS est aussi plus courte — « Code : {code} (valable {minutes}
# min) » — ce qui compte sur un canal borne a 160 caracteres.
#
# ModelesSansDoublonTest interdit desormais toute cle dupliquee dans ce fichier.

# --- Reinitialisation de mot de passe (SMS_PASSWORD_RESET, EMAIL_PASSWORD_RESET) ---
securite.reinitialisation-mot-de-passe.sujet=Réinitialisation de mot de passe
securite.reinitialisation-mot-de-passe.corps=Bonjour,\n\nVotre code de réinitialisation est: {code}\n\nCe code est valide pendant {minutes} minutes.\n\nSi vous n'avez pas demandé cette réinitialisation, veuillez ignorer cet email et sécuriser votre compte.\n\nCordialement,\nL'équipe
securite.reinitialisation-mot-de-passe.sms.corps=Votre code de réinitialisation est: {code}. Valide pendant {minutes} minutes.

# --- Bienvenue (EMAIL_WELCOME) ---
#
# Aucune variante SMS, et c'est exact : ce message n'a jamais existe en SMS chez
# auth-service. Un canal sans modele produit un refus « modele introuvable »,
# visible dans le compte rendu — mieux qu'un SMS de bienvenue qui coute un
# credit pour une information que personne n'attend.
compte.bienvenue.sujet=Bienvenue sur notre plateforme
compte.bienvenue.corps=Bonjour {firstName},\n\nBienvenue sur notre plateforme !\n\nVotre compte a été créé avec succès.\n\nCordialement,\nL'équipe

