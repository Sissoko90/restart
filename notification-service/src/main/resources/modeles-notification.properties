# ==========================================================
# Modeles de notification
# ==========================================================
# Forme des cles :
#
#   <modele>.<canal>.sujet     variante propre a un canal
#   <modele>.<canal>.corps
#   <modele>.sujet             repli, tous canaux
#   <modele>.corps
#
# Le canal est en minuscules : courriel, sms, in_app, push, websocket.
#
# POURQUOI DES VARIANTES PAR CANAL : un SMS tient en 160 caracteres, un
# courriel non. Un seul texte pour les deux obligerait a choisir le plus
# contraint, donc a appauvrir le courriel.
#
# Les variables s'ecrivent {nomDeLaVariable} et sont substituees
# LITTERALEMENT, en un seul passage. Une valeur contenant elle-meme des
# accolades reste donc du texte : aucune evaluation, donc aucune injection.
#
# Un modele demande et absent de ce fichier n'envoie RIEN et remonte REFUSE
# dans le compte rendu. C'est volontaire : un message vide est pire qu'un
# message absent, parce qu'il fait croire a l'emetteur qu'il a notifie.
# ==========================================================

# ----------------------------------------------------------
# Projets — emis par interface-service
# ----------------------------------------------------------
projet.cree.sujet=Votre projet {nomDuProjet} est cree
projet.cree.corps=Votre projet {nomDuProjet} vient d'etre cree.
projet.cree.sms.corps=Projet {nomDuProjet} cree.

projet.supprime.sujet=Votre projet {nomDuProjet} a ete supprime
projet.supprime.corps=Votre projet {nomDuProjet} a ete supprime. Le quota correspondant vous est restitue.
projet.supprime.sms.corps=Projet {nomDuProjet} supprime.

# ----------------------------------------------------------
# Securite — emis par auth-service
# ----------------------------------------------------------
# AUCUN de ces modeles ne nomme une coordonnee, ni l'ancienne ni la nouvelle.
#
# Raison inscrite en memoire du projet : prevenir la nouvelle adresse ne
# previent que l'attaquant. Un courriel intercepte qui citerait la nouvelle
# adresse confirmerait a l'attaquant que son changement a pris effet.
#
# Mais ils nomment bien QUEL contact a change, et c'est different. Dire
# « l'adresse a ete remplacee » sans donner la nouvelle respecte la regle
# ci-dessus ; dire seulement « vos coordonnees ont ete modifiees » retire une
# information que la personne a besoin d'avoir pour comprendre ce qu'elle a
# perdu.
#
# C'EST UNE CORRECTION. Ce bloc portait un unique `securite.contact-modifie`
# generique — « Les coordonnees de votre compte ont ete modifiees le {date} » —
# alors qu'auth-service, le seul emetteur reel de ces alertes, distingue depuis
# toujours l'adresse du numero avec des textes qui nomment la CONSEQUENCE. Y
# migrer auth-service aurait donc degrade trois alertes de securite d'un coup.
# Le modele generique a ete retire : un nom par message, celui que l'emetteur
# sait distinguer.
#
# {circonstances} porte les lignes « Quand / Lieu / Adresse IP / Appareil »,
# assemblees par l'emetteur. Pourquoi une seule variable et non quatre : le lieu
# et l'adresse IP sont parfois INCONNUS, et la ligne doit alors disparaitre.
# Avec quatre variables, un marqueur absent resterait visible — le moteur laisse
# « {lieu} » en place plutot que d'ecrire « null » — et une valeur vide
# laisserait une ligne « Lieu : » orpheline. Le moteur ne porte aucune
# conditionnelle, et c'est volontaire : une conditionnelle suppose l'evaluation
# d'expressions, donc une surface d'injection sur un texte desormais modifiable
# a chaud en base.
#
# La CONDUITE A TENIR est recopiee a l'identique dans les quatre corps. La
# duplication est assumee, parce que l'alternative — la faire passer en variable
# — remettrait ce texte chez l'emetteur. ModelesSansDoublonTest verifie que les
# quatre copies restent identiques, ce qui transforme la duplication en
# invariant controle plutot qu'en derive probable.

securite.mot-de-passe-modifie.sujet=Votre mot de passe a ete modifie
securite.mot-de-passe-modifie.corps=Le mot de passe de votre compte vient d'etre modifie, et toutes vos sessions ont ete fermees.\n\n{circonstances}\nSi vous reconnaissez cette operation, aucune action n'est necessaire.\nSinon, ouvrez l'application et changez votre mot de passe sans attendre, puis deconnectez vos autres appareils.
securite.mot-de-passe-modifie.sms.corps=Restart : le mot de passe de votre compte vient d'etre modifie. Si ce n'est pas vous, contactez-nous immediatement.

# Adresse a l'ANCIENNE adresse, et le texte le dit explicitement.
#
# Sans cette precision, la personne lit « votre adresse a ete modifiee » sur une
# adresse qui, de son point de vue, est toujours la bonne — et ne comprend pas
# qu'elle vient de perdre l'acces a son compte.
securite.adresse-modifiee.sujet=L'adresse electronique de votre compte a ete modifiee
securite.adresse-modifiee.corps=L'adresse electronique de votre compte vient d'etre remplacee par une autre. Ce message est envoye a votre ancienne adresse : si vous n'etes pas a l'origine de ce changement, vous n'avez plus acces a ce compte.\n\n{circonstances}\nSi vous reconnaissez cette operation, aucune action n'est necessaire.\nSinon, ouvrez l'application et changez votre mot de passe sans attendre, puis deconnectez vos autres appareils.
securite.adresse-modifiee.sms.corps=Restart : l'adresse electronique de votre compte vient d'etre modifiee. Si ce n'est pas vous, contactez-nous immediatement.

# Adresse a l'ANCIEN numero, et le corps nomme la consequence reelle, qui n'est
# pas evidente : le numero est le canal de la reinitialisation du mot de passe.
# Qui le remplace prend le controle du compte entier sans connaitre le mot de
# passe.
securite.numero-modifie.sujet=Le numero de telephone de votre compte a ete modifie
securite.numero-modifie.corps=Le numero de telephone de votre compte vient d'etre remplace par un autre. Ce message est envoye a votre ancien numero : si vous n'etes pas a l'origine de ce changement, la recuperation de votre compte par SMS ne vous appartient plus.\n\n{circonstances}\nSi vous reconnaissez cette operation, aucune action n'est necessaire.\nSinon, ouvrez l'application et changez votre mot de passe sans attendre, puis deconnectez vos autres appareils.
securite.numero-modifie.sms.corps=Restart : ce numero n'est plus celui de votre compte. Si ce n'est pas vous, contactez-nous immediatement.

# AUCUNE variante SMS, et c'est delibere.
#
# La personne a demande une alerte PAR COURRIEL, et une connexion est frequente :
# un repli par SMS enverrait un message payant a chaque connexion, pour un canal
# qu'elle n'a pas choisi. L'emetteur ne propose donc que le courriel pour cette
# alerte.
securite.nouvelle-connexion.sujet=Nouvelle connexion a votre compte
securite.nouvelle-connexion.corps=Une connexion a votre compte vient d'aboutir.\n\n{circonstances}\nSi vous reconnaissez cette operation, aucune action n'est necessaire.\nSinon, ouvrez l'application et changez votre mot de passe sans attendre, puis deconnectez vos autres appareils.

# Le code n'apparait QUE dans le corps, jamais dans le sujet : un sujet
# s'affiche sur un ecran verrouille et dans les apercus de notification.
securite.code-de-verification.sujet=Votre code de verification
securite.code-de-verification.corps=Votre code de verification est {code}. Il expire dans {minutes} minutes. Ne le communiquez a personne.
securite.code-de-verification.sms.corps=Code : {code} (valable {minutes} min). Ne le communiquez a personne.

# ----------------------------------------------------------
# Quotas — emis par quotas-service
# ----------------------------------------------------------
quota.seuil-atteint.sujet=Vous approchez de votre limite
quota.seuil-atteint.corps=Vous avez consomme {pourcentage}% de votre quota de {ressource}.

# ==========================================================
# Modeles venus d'auth-service
# ==========================================================
# auth-service tient son propre moteur de modeles, adosse a la table
# message_templates et modifiable par MessageTemplateController. Son enum
# TemplateType compte cinq valeurs :
#
#   SMS_VERIFICATION      EMAIL_VERIFICATION
#   SMS_PASSWORD_RESET    EMAIL_PASSWORD_RESET
#                         EMAIL_WELCOME
#
# CE NOMMAGE MELANGE LE CANAL ET L'OBJET. SMS_VERIFICATION et
# EMAIL_VERIFICATION sont le MEME message sur deux canaux : les separer en deux
# types oblige a tenir deux textes d'accord, et le jour ou l'un change l'autre
# reste. Avec (modele, canal), l'objet est nomme une fois et le canal n'est
# qu'une variante — avec un repli commun quand elle n'existe pas.
#
# Les textes ci-dessous sont ceux de DataSeeder, mot pour mot. Les porter ici
# est le PREALABLE au retrait du moteur d'auth-service : tant qu'ils n'existent
# que la-bas, cesser de composer chez l'appelant produirait « modele
# introuvable » — un refus visible, mais un code que personne ne recoit.
#
# UneSeuleSourceDesModelesTest verifie que les cinq ont bien leur contrepartie.

# --- Code de verification : AUCUNE cle ajoutee, et c'est le point ---
#
# securite.code-de-verification existe DEJA plus haut (lignes 55-57), et son
# texte est MEILLEUR que celui d'auth-service sur un point de securite : il dit
# « Ne le communiquez a personne ». Le texte d'auth-service ne le dit pas.
#
# Porter les cinq modeles « mot pour mot » aurait donc RETIRE un avertissement
# de securite — et en silence, puisqu'un fichier .properties accepte une cle
# dupliquee et garde la DERNIERE. C'est exactement ce qui s'est produit a
# l'ecriture de ce bloc, et c'est la comparaison des deux versions qui l'a
# montre.
#
# Sa variante SMS est aussi plus courte — « Code : {code} (valable {minutes}
# min) » — ce qui compte sur un canal borne a 160 caracteres.
#
# ModelesSansDoublonTest interdit desormais toute cle dupliquee dans ce fichier.

# --- Reinitialisation de mot de passe (SMS_PASSWORD_RESET, EMAIL_PASSWORD_RESET) ---
securite.reinitialisation-mot-de-passe.sujet=Réinitialisation de mot de passe
securite.reinitialisation-mot-de-passe.corps=Bonjour,\n\nVotre code de réinitialisation est: {code}\n\nCe code est valide pendant {minutes} minutes.\n\nSi vous n'avez pas demandé cette réinitialisation, veuillez ignorer cet email et sécuriser votre compte.\n\nCordialement,\nL'équipe
securite.reinitialisation-mot-de-passe.sms.corps=Votre code de réinitialisation est: {code}. Valide pendant {minutes} minutes.

# --- Bienvenue (EMAIL_WELCOME) ---
#
# Aucune variante SMS, et c'est exact : ce message n'a jamais existe en SMS chez
# auth-service.
#
# LA PHRASE QUI SUIVAIT ETAIT FAUSSE. Elle affirmait qu'« un canal sans modele
# produit un refus modele introuvable, mieux qu'un SMS de bienvenue qui coute un
# credit ». Le moteur repliait alors `<modele>.sms.corps` sur `<modele>.corps` :
# un SMS de bienvenue serait bien parti, avec le corps ecrit pour le courriel,
# donc tronque par l'operateur ou facture en plusieurs messages. L'affirmation
# protegeait sur le papier et laissait passer dans les faits, du cote qui coute.
#
# Le moteur ne replie plus pour le SMS — voir MoteurDeModeles.CANAUX_SANS_REPLI —
# ce qui rend cette phrase vraie au lieu de l'avoir corrigee a la baisse.
#
# AUCUN EMETTEUR. Et il n'y en a jamais eu : `sendWelcomeEmail` existait dans
# auth-service, etait implemente, son modele etait amorce par DataSeeder, et
# AUCUNE ligne de production ne l'appelait. La methode a ete supprimee avec le
# reste ; ce modele reste, visible dans GET /admin/modeles, pret pour le jour ou
# quelqu'un enverra vraiment ce message.
compte.bienvenue.sujet=Bienvenue sur notre plateforme
compte.bienvenue.corps=Bonjour {firstName},\n\nBienvenue sur notre plateforme !\n\nVotre compte a été créé avec succès.\n\nCordialement,\nL'équipe

# ----------------------------------------------------------
# Exploitation — alertes destinees a un OPERATEUR
# ----------------------------------------------------------
# CE QUI ETAIT ICI, ET POURQUOI C'ETAIT FAUX
#
# Un seul modele DE TRANSIT, `exploitation.alerte`, dont le sujet et le corps
# etaient les variables. Le raisonnement ecrit a cet endroit disait :
# « modeliser ces alertes ferait un gabarit par incident, qu'on tiendrait
# d'accord a la main ». C'est ce raisonnement qui a produit le defaut.
#
# Il y a TROIS incidents, pas une infinite. Et tant que le texte n'etait pas
# ici, il restait la-bas : interface-service composait trois corps HTML en
# concatenation de chaines Java, que ce modele transportait vers un canal
# declare sans variante `corps-html`. Le courriel partait donc en texte brut
# AVEC son balisage dedans, et le destinataire lisait la source. Mesure faite
# sur un courriel recu le 2026-11-10 a 20:02 UTC.
#
# CE QUE LE DEPLACEMENT CORRIGE EN PLUS DU RENDU
#
# L'echappement. `AdminController` inserait `user-agent`, l'adresse et les
# champs de geolocalisation dans son HTML par `String.format`. Le `User-Agent`
# est pose par l'ATTAQUANT que l'alerte denonce : il pouvait ecrire du
# balisage — un lien, un faux bouton — dans le courriel de securite lu par
# l'exploitant. Passe en variable d'un `corps-html`, tout cela est echappe par
# le rendu.
#
# La duplication. Chaque alerte existait DEUX fois dans AdminController, une
# par branche de la geolocalisation : soixante lignes recopiees, que rien
# n'obligeait a rester d'accord. Un seul gabarit, et les champs absents portent
# « non disponible ».
#
# POURQUOI `attaque-admin` N'A PAS DE VARIANTE HTML
#
# Les deux premieres visent une personne qui lit un message ; la troisieme est
# un RAPPORT d'incident. Sans HTML, l'URL de maintenance se lit en entier au
# lieu d'etre cachee derriere un bouton — ce qui est exactement ce qu'on veut
# verifier avant de cliquer sur un lien recu pendant une attaque.

# Le secret de recuperation regenere, envoye chiffre a l'administrateur.
# {secret} est un chiffre RSA en base64 : il ne contient ni `<` ni `&`, mais il
# est echappe comme toute variable du corps HTML — l'echappement est porte par
# le rendu, jamais par la confiance faite a l'emetteur.
exploitation.secret-de-recuperation.sujet=Nouveau secret de recuperation
exploitation.secret-de-recuperation.corps=Bonjour {prenom},\n\nLe secret de recuperation de votre compte administrateur vient d'etre regenere automatiquement.\n\nSECRET CHIFFRE (RSA)\n\n{secret}\n\nDechiffrez-le avec votre cle privee. Il remplace le precedent, qui ne vaut plus.\n\nConservez-le hors ligne : c'est lui qui permet de reprendre la main sur le compte administrateur si le mot de passe est perdu.\n\nUn nouveau secret sera genere dans {heures} heures.

# Tentative de connexion administrateur : les deux liens d'action sont dans le
# texte EN ENTIER, et derriere des boutons dans la variante HTML.
exploitation.connexion-admin.sujet=Alerte de securite : tentative de connexion administrateur
exploitation.connexion-admin.corps=Une tentative de connexion au compte administrateur vient d'etre detectee.\n\nCONNEXION\n  Compte : {courriel}\n  Heure : {heure}\n  Adresse IP : {ip}\n\nPROVENANCE\n  Pays : {pays} ({codePays})\n  Ville : {ville}\n  Region : {region}\n  Fuseau horaire : {fuseau}\n  Coordonnees : {latitude}, {longitude}\n  Fournisseur d'acces : {fournisseur}\n  Organisation : {organisation}\n  Systeme autonome : {asn}\n\nAPPAREIL\n  Type : {typeAppareil}\n  Navigateur : {navigateur}\n  Systeme : {systeme}\n  User-Agent : {agent}\n\nTENTATIVE\n  Identifiant : {identifiant}\n  Evenement : {evenement}\n  Statut : {statut}\n  Horodatage : {horodatage}\n\nSI C'EST VOUS, ouvrez ce lien :\n{confirmer}\n\nSI CE N'EST PAS VOUS, ouvrez celui-ci — il bloque la tentative :\n{bloquer}\n\nCes deux liens expirent dans {minutes} minutes.

# Rapport d'attaque. Texte seul, delibere : voir l'explication ci-dessus.
exploitation.attaque-admin.sujet=ALERTE CRITIQUE : tentatives repetees sur le compte administrateur
exploitation.attaque-admin.corps=URGENT — tentatives repetees sur le compte administrateur.\n\nLa premiere couche de securite — la confirmation administrateur — a ete franchie, et {tentativesApresConfirmation} tentatives ont suivi.\n\nORIGINE\n  Compte vise : {courriel}\n  Heure : {heure}\n  Adresse IP : {ip}\n\nPROVENANCE\n  Pays : {pays} ({codePays})\n  Ville : {ville}\n  Region : {region}\n  Fuseau horaire : {fuseau}\n  Coordonnees : {latitude}, {longitude}\n  Fournisseur d'acces : {fournisseur}\n  Organisation : {organisation}\n  Systeme autonome : {asn}\n\nAPPAREIL\n  Type : {typeAppareil}\n  Navigateur : {navigateur}\n  Systeme : {systeme}\n  User-Agent : {agent}\n\nDECOMPTE\n  Tentatives au total : {tentatives}\n  Tentatives apres confirmation : {tentativesApresConfirmation}\n\nCE QUI A DEJA ETE FAIT\n  L'adresse IP est bloquee.\n  Le compte administrateur est verrouille.\n\nSI CET ACCES EST LEGITIME, le lien de maintenance ci-dessous le retablit :\n\n{maintenance}\n\nIl expire dans {heures} heures. Ne l'ouvrez que si vous etes a l'origine de ces tentatives.
