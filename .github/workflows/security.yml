# ==========================================================
# Analyse de sécurité
# ==========================================================
# Séparé de la CI parce que plus lent, et parce que certaines
# analyses n'ont de sens que périodiquement : une dépendance
# saine aujourd'hui peut devenir vulnérable demain sans qu'une
# seule ligne du dépôt ne change.
#
# Politique de blocage (décidée le 2026-09-04) :
#   - BLOQUE : secrets détectés, vulnérabilités CRITICAL/HIGH,
#              licences incompatibles avec une distribution propriétaire
#   - SIGNALE : le reste
# ==========================================================
name: Sécurité

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Tous les lundis à 4h UTC : détecte les CVE publiées depuis
    # le dernier commit, sans attendre une modification du code.
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # 1. Secrets — la première chose à vérifier
  # ------------------------------------------------------------------
  secrets:
    name: Fuite de secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # L'historique complet est nécessaire : un secret retiré d'un commit
          # reste dans les commits précédents, et reste donc compromis.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # 2. Analyse statique du code (SAST) — CWE / OWASP
  # ------------------------------------------------------------------
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          # `security-and-quality` couvre les requêtes CWE, dont celles
          # correspondant au Top 10 OWASP et au CWE Top 25 du MITRE.
          queries: security-and-quality

      - name: Compiler
        run: mvn -B -ntp -DskipTests package

      - name: Analyser
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin

  # ------------------------------------------------------------------
  # 3. Vulnérabilités des dépendances
  # ------------------------------------------------------------------
  dependances:
    name: Vulnérabilités des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # ------------------------------------------------------------------
      # LE PERIMETRE DE L'ANALYSE EST RESOLU LOCALEMENT, ET C'EST LE POINT
      # ------------------------------------------------------------------
      # Trivy lisait les `pom.xml`. Pour connaitre l'arbre TRANSITIF il doit
      # alors aller chercher les POM parents et les BOM sur Maven Central —
      # et quand cette requete reseau echoue, il retombe sur les seules
      # dependances DIRECTES sans le dire.
      #
      # Mesure sur deux executions consecutives, meme code, 40 minutes
      # d'ecart :
      #   2b5a2db : 14 pom.xml lus,  0 ligne de CVE  -> VERT
      #   057a292 : 28 pom.xml lus, 756 lignes, 25 artefacts -> ROUGE
      # Le commit intermediaire ne touchait aucune dependance.
      #
      # Un garde-fou bloquant qui passe ou echoue selon la chance reseau est
      # pire qu'aucun garde-fou : il apprend a relancer jusqu'au vert. Et il
      # masquait 4 CVE CRITIQUES qui etaient dans l'arbre depuis le debut.
      #
      # On resout donc l'arbre AVANT, avec Maven, puis Trivy analyse les JAR
      # reellement produits. Le perimetre devient exactement ce qui est
      # livre, il ne depend plus du reseau, et il est reproductible.
      #
      # Portee `runtime` : compile + runtime, sans test. Analyser les
      # dependances de test signalerait des vulnerabilites qui n'atteignent
      # jamais la production, et chaque faux positif erode la confiance dans
      # la barriere.
      #
      # ATTENTION AU NOM DU DRAPEAU : `-DincludeScope`, et NON
      # `-Dmdep.includeScope`. Le second est ignore EN SILENCE — mesure sur
      # auth-service :
      #   -Dmdep.includeScope=runtime  -> 331 JAR, dont 3 BouncyCastle de test
      #   (aucun filtre)               -> 331 JAR, dont 3  [identique]
      #   -DincludeScope=runtime       -> 274 JAR, dont 0
      # Sur le reacteur complet : 425 sans filtre, 366 avec. C'est le meme
      # piege que les proprietes inventees du POM — un reglage qui parait
      # applique et ne l'est pas.
      - name: Resoudre l'arbre reel des dependances
        run: |
          mvn -B -ntp -DskipTests install \
            dependency:copy-dependencies \
            -DoutputDirectory="${{ github.workspace }}/arbre-resolu" \
            -DincludeScope=runtime
          echo "JAR resolus : $(ls -1 "${{ github.workspace }}/arbre-resolu"/*.jar | wc -l)"

      # Un plancher, pour la meme raison que dans les gardes du depot : si la
      # resolution echouait a moitie, Trivy analyserait trois JAR et rendrait
      # vert. Un garde-fou doit echouer bruyamment, jamais silencieusement.
      - name: Verifier que l'arbre a bien ete resolu
        run: |
          NB=$(ls -1 "${{ github.workspace }}/arbre-resolu"/*.jar 2>/dev/null | wc -l)
          echo "JAR presents : $NB"
          # 366 mesures en local au 2026-11-04, portee runtime, reacteur
          # complet. Le plancher a 300 laisse de la marge pour une dependance
          # retiree, tout en attrapant une resolution a moitie echouee.
          if [ "$NB" -lt 300 ]; then
            echo "::error::Seulement $NB JAR resolus, attendu plus de 300. L'analyse porterait sur un perimetre tronque et rendrait un vert trompeur."
            exit 1
          fi

      - name: Trivy — vulnerabilites des artefacts livres
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: arbre-resolu
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM
          scanners: vuln

      - name: Publier dans l'onglet Sécurité
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy

      # Le depot lui-meme : secrets et defauts de configuration. Separe de
      # l'analyse des dependances parce que son perimetre est le code source,
      # pas l'arbre des artefacts — et parce qu'il ne depend d'aucune
      # resolution, donc il est deterministe par nature.
      - name: Trivy — secrets et configuration du depot
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-depot.sarif
          severity: CRITICAL,HIGH,MEDIUM
          scanners: secret,misconfig

      - name: Publier l'analyse du dépôt
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-depot.sarif
          category: trivy-depot

      # Passage bloquant, sur le meme perimetre resolu.
      - name: Trivy — blocage sur CRITICAL/HIGH
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: arbre-resolu
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln

  # ------------------------------------------------------------------
  # 4. OWASP Dependency-Check — second avis
  # ------------------------------------------------------------------
  # Deux outils sur le même périmètre n'est pas redondant : leurs bases
  # de correspondance diffèrent, et chacun voit des paquets que l'autre
  # manque.
  #
  # CE JOB N'EST PLUS IGNORE SUR UN PUSH, et le changement est voulu.
  #
  # Il portait `if: schedule || workflow_dispatch`, donc « Skipped » sur
  # chaque push. Et sur 26 exécutions du workflow — 15 pull_request,
  # 11 push, zéro schedule — il n'avait jamais tourné une seule fois.
  #
  # Pire : même lancé, il ne scannait rien. L'étape faisait `exit 0`
  # avec un simple ::warning:: quand NVD_API_KEY est absent, donc un job
  # VERT sans analyse. Un second avis déclaré, planifié, et inerte.
  #
  # Désormais l'absence de la clé fait ÉCHOUER le job, avec le message
  # qui dit quoi faire. Un garde-fou qui ne peut pas fonctionner doit se
  # voir, pas se taire : c'est la seule différence entre une protection
  # et un décor.
  owasp:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    # 60 -> 120 minutes, et la mesure l'impose.
    #
    # Premiere execution avec la cle NVD, cache froid : demarree a 15:26:19,
    # tuee a 16:26:37 -- soit 60 min et 18 s. GitHub rapporte un job expire
    # comme « cancelled », ce qui ne ressemble ni a un succes ni a un echec.
    #
    # LE PIEGE QUE CELA CREAIT : `actions/cache` n'ecrit son cache qu'a la FIN
    # du job. Expire, il n'ecrit rien -- donc l'execution suivante repart a
    # froid et expire aussi. Une boucle ou le cache ne se remplit jamais, et ou
    # le second avis ne tourne jamais.
    #
    # La premiere execution doit donc pouvoir ABOUTIR. Les suivantes liront le
    # cache et prendront quelques minutes.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # La base du NVD est volumineuse, et son téléchargement est le poste
      # de coût de ce job. La mettre en cache évite de la retirer à chaque
      # push, ce qui serait intenable maintenant que le job tourne à
      # chaque fois.
      - name: Cache de la base NVD
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-${{ runner.os }}-

      - name: Analyser
        # Sans NVD_API_KEY, le NVD limite très fortement le téléchargement :
        # l'analyse dépasse l'heure et échoue. La clé est gratuite.
        #
        # ÉCHEC et non `exit 0`. Rendre vert sans avoir analysé est la forme
        # la plus trompeuse de succès, et c'est exactement ce que ce job
        # faisait.
        #
        # Le secret passe par `env:` et non par une interpolation `${{ }}`
        # dans la commande. Deux raisons : la valeur n'est pas substituée
        # dans le texte du script — donc rien à casser ni à injecter si elle
        # contient un caractère shell — et elle n'apparaît pas dans la ligne
        # de commande du processus, lisible par `ps`.
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::NVD_API_KEY absent : ce second avis ne peut pas fonctionner, et ce job echoue plutot que de rendre un vert sans avoir rien analyse."
            echo "Ajouter le secret NVD_API_KEY (gratuit) :"
            echo "  https://nvd.nist.gov/developers/request-an-api-key"
            echo "Puis : Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
          # Version ÉPINGLÉE. Elle ne l'était pas :
          # `org.owasp:dependency-check-maven:check` sans version résout la
          # dernière publiée — un outil de sécurité qui change sous nos pieds
          # d'un push à l'autre, sans qu'aucun commit ne le dise.
          mvn -B -ntp org.owasp:dependency-check-maven:13.0.0:check \
            -DnvdApiKey="$NVD_API_KEY" \
            -DfailBuildOnCVSS=7 \
            -Dformats=HTML,SARIF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-owasp
          path: '**/target/dependency-check-report.*'
          retention-days: 30

  # ------------------------------------------------------------------
  # 5. Licences des dépendances
  # ------------------------------------------------------------------
  licences:
    name: Conformité des licences
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Inventorier les licences tierces
        run: mvn -B -ntp license:aggregate-download-licenses license:aggregate-add-third-party

      - name: Vérifier la compatibilité avec une distribution propriétaire
        run: ./scripts/license-check.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventaire-licences
          path: target/generated-sources/license/
          retention-days: 30
