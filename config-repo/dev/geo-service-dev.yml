# ==========================================
# GEO SERVICE - Configuration DEV
# ==========================================

server:
  port: 8084

spring:
  application:
    name: geo-service
  
  # DATABASE CONFIGURATION
  # Note: datasource credentials sont chargés depuis .env via DotenvConfig
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  
  # OAuth2 Resource Server - autorité JWT = interface-service (plus de Keycloak)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8088}
          jwk-set-uri: ${JWKS_URL:http://localhost:8088/dev/.well-known/jwks.json}

geo:
  max-distance-km: 50
  default-radius-km: 10
  cache-ttl-seconds: 300
