# ==========================================
# PAYMENT SERVICE - Configuration DEV
# ==========================================

server:
  port: 8085

spring:
  application:
    name: payment-service
  profiles:
    active: dev
  
  # DATABASE CONFIGURATION
  # Note: datasource credentials sont chargés depuis .env via DotenvConfig
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  # Kafka Configuration - DEV
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: payment-service-group-dev
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
      auto-offset-reset: earliest
  
  # OAuth2 Resource Server - autorité JWT = interface-service (plus de Keycloak)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8088}
          jwk-set-uri: ${JWKS_URL:http://localhost:8088/dev/.well-known/jwks.json}

# Payment Providers Configuration - DEV (mock values)
payment:
  providers:
    orange-money:
      api-key: ${ORANGE_MONEY_API_KEY}
      api-secret: ${ORANGE_MONEY_API_SECRET}
      merchant-id: ${ORANGE_MONEY_MERCHANT_ID:dev-merchant-id}
      base-url: https://api.orange.com/orange-money-webpay/dev/v1
    moov-money:
      api-key: ${MOOV_MONEY_API_KEY}
      api-secret: ${MOOV_MONEY_API_SECRET}
      merchant-id: ${MOOV_MONEY_MERCHANT_ID:dev-merchant-id}
      base-url: https://api.moov-africa.com/v1
  
  transaction:
    timeout-seconds: 300
    max-retry-attempts: 3
