# ==========================================
# INTERFACE SERVICE - Configuration DEV
# ==========================================
# Service de gestion des projets pour développeurs
# Port: 8088 (éviter conflit avec payment-service:8085)

server:
  port: 8088

spring:
  application:
    name: interface-service
  
  # Configuration R2DBC PostgreSQL spécifique
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME_INTERFACE:interface_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 5
      max-size: 10
      max-idle-time: 30m
      validation-query: SELECT 1
  
  # Redis - Base dédiée à interface-service
  data:
    redis:
      database: 3  # Base dédiée (0=gateway, 1=auth, 2=user, 3=interface)

  # Consul : chemin de controle de sante.
  #
  # CE BLOC ETAIT SOUS `gateway:`, DONC INERTE.
  #
  # Il vivait sous `gateway.cloud.consul.discovery`, et Spring ne lit que
  # `spring.cloud.consul.discovery`. Aucune erreur, aucun avertissement : une
  # clef inconnue est ignoree en silence. interface-service s'enregistrait donc
  # avec le defaut du cadre, `/actuator/health`.
  #
  # La difference n'est pas cosmetique. `/actuator/health` agrege TOUS les
  # indicateurs — Redis, la base, le serveur de configuration. Une panne d'une
  # dependance rend le service DOWN aux yeux de Consul, qui le retire de la
  # decouverte : la passerelle ne le trouve plus, alors que le processus est
  # vivant et sert tres bien les requetes qui ne touchent pas cette dependance.
  # `liveness` ne repond que « ce processus est vivant ».
  #
  # Cinq services declarent deja cette clef au bon endroit, dont setting,
  # quotas et security avec la meme valeur.
  cloud:
    consul:
      discovery:
        health-check-path: /actuator/health/liveness
        health-check-critical-timeout: 30s

  # Flyway : les neuf migrations de ce module n'etaient lues par personne.
  #
  # Ce bloc n'existait pas, et le POM ne declarait aucun artefact Flyway.
  # Resultat mesure le 2026-11-10 : interface_db est restee a la version 8,
  # datee du 2026-04-17. V9 attendait depuis — celle qui retire
  # `users.refresh_token`, la colonne des jetons en clair, pendant que le code
  # ne lit plus que `refresh_token_hash`.
  #
  # `url` est en JDBC et non en R2DBC : Flyway n'a pas d'API reactive. C'est la
  # seule connexion bloquante du service, ouverte au demarrage puis fermee —
  # elle ne touche pas le chemin des requetes.
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME_INTERFACE:interface_db}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration
    # FAUX : plus rien n'a a etre adopte.
    #
    # A `true` sans `baseline-version`, Flyway qui trouve un schema non vide
    # sans historique inscrit « version 1 deja passee » et SAUTE V1. Mesure le
    # 2026-11-10 sur user_service_db : six tables, aucun historique — V1 aurait
    # ete declaree appliquee, et deux de ses quatre tables n'auraient jamais
    # existe. Le service aurait demarre sans se plaindre.
    #
    # A `false`, Flyway refuse un schema non vide sans historique, et le dit.
    baseline-on-migrate: false

# ==========================================
# GATEWAY SECURITY
# ==========================================
gateway:
  secret:
    key: ${GATEWAY_SECRET_KEY}
  # Configuration OpenAPI/Swagger spécifique
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# Rate Limiting spécifique à interface-service
resilience4j:
  ratelimiter:
    instances:
      developer-auth:
        limitForPeriod: 10
        limitRefreshPeriod: 60s
      project-operations:
        limitForPeriod: 50
        limitRefreshPeriod: 60s
  circuitbreaker:
    instances:
      quotas-service:
        baseConfig: default
      auth-service:
        baseConfig: default

# Configuration services externes spécifiques
services:
  quotas-service:
    # 8089 = port réel de quotas-service (pointait par erreur sur 8086, notification-service)
    url: ${QUOTAS_SERVICE_URL:http://localhost:8089}
    timeout-ms: 2000
  auth-service:
    url: http://localhost:8082
  gateway-service:
    url: http://localhost:8081

# Configuration métier spécifique
business:
  project:
    id:
      min-length: 3
      max-length: 30
      pattern: "^[a-z0-9-]+$"
    name:
      min-length: 3
      max-length: 50
    description:
      max-length: 500

# ==========================================================
# ADMIN PAR DÉFAUT (SEEDER)
# ==========================================================
# interface-service tient son PROPRE registre d'utilisateurs : les
# administrateurs du portail développeur. Ils sont distincts de ceux
# d'auth-service, qui administre les utilisateurs finaux — deux tables
# `users`, deux populations (voir docs/COMPLIANCE.md §1).
#
# C'est pourquoi ce bloc est dupliqué depuis auth-service-dev.yml et
# non partagé : les deux comptes peuvent, et devraient, différer.
#
# Aucune valeur par défaut : sans ces variables, le service refuse de
# démarrer plutôt que de créer un compte administrateur dont les
# identifiants seraient connus de quiconque lit le dépôt.
admin:
  default:
    phone: ${ADMIN_DEFAULT_PHONE}
    email: ${ADMIN_DEFAULT_EMAIL}
    password: ${ADMIN_DEFAULT_PASSWORD}
    firstName: ${ADMIN_DEFAULT_FIRSTNAME}
    lastName: ${ADMIN_DEFAULT_LASTNAME}

  # `admin.secret.key` ETAIT ABSENT, et cela fermait toute l'administration.
  #
  # AdminSecretFilter lit ${admin.secret.key:} — avec un defaut VIDE — et refuse
  # en 401 des que la valeur est vide. La propriete n'etait definie nulle part :
  # ni ici, ni dans application-dev.yml, ni dans le application.yml du module.
  # Chaque appel a /admin/** repondait donc 401, a la seule exception de
  # /admin/confirm, exempte parce qu'il est atteint par un clic dans un courriel.
  #
  # .env.example documentait bien ADMIN_SECRET_KEY, mais rien ne faisait le lien
  # entre la variable et la propriete. Le secret existait, portait un nom, et
  # n'arrivait a aucun lecteur.
  #
  # MaintenanceController, lui, lisait System.getenv("ADMIN_SECRET_KEY") —
  # l'environnement du PROCESSUS, que DotenvConfig ne peut pas alimenter (il
  # depose ses valeurs dans un MapPropertySource de l'Environment Spring, et
  # System.getenv est immuable en Java). /maintenance/auth repondait donc 403
  # sauf si l'exploitant exportait la variable dans son shell. Il lit desormais
  # cette meme propriete : un seul secret, un seul nom, un seul lecteur.
  #
  # Le defaut reste VIDE et non obligatoire : la politique du projet est de ne
  # pas bloquer le demarrage sur une variable absente. Les deux lecteurs sont
  # fermes par defaut et le disent en WARN — l'administration est inaccessible,
  # jamais ouverte.
  secret:
    key: ${ADMIN_SECRET_KEY:}

# ==========================================================
# COMPTE DE MAINTENANCE
# ==========================================================
# MaintenanceSeeder lit ces deux valeurs. Elles n'étaient déclarées
# nulle part : les littéraux retirés de la classe étaient la seule
# source, et le service refusait de démarrer sur
# « Could not resolve placeholder 'maintenance.phone' ».
#
# Défaut VIDE, et non absent : le seeder ne crée alors aucun compte,
# comme SuperAdminSeeder. Un compte de maintenance créé sur des
# valeurs de repli aurait des identifiants lisibles dans le dépôt,
# ce qui est pire que pas de compte.
#
# À RECONSIDÉRER : ce compte précède la décision de confier la mise
# en maintenance au SUPER_ADMIN d'auth-service. Un rôle MAINTENANCE
# dans la table d'interface-service fait doublon avec ce choix, et
# disparaîtra avec la table `users` de ce service.
maintenance:
  phone: ${MAINTENANCE_PHONE:}
  password: ${MAINTENANCE_PASSWORD:}
  # Etait ecrite en dur dans MaintenanceSeeder (maintenance@abdatech.com), sur
  # un domaine que le projet ne porte plus. Defaut vide : sans les TROIS
  # valeurs, le compte de maintenance n'est pas cree, et le service demarre.
  email: ${MAINTENANCE_EMAIL:}

# ==========================================================
# ALERTES CRITIQUES DE SÉCURITÉ
# ==========================================================
# Destinataire des alertes d'attaque sur le compte administrateur.
# L'adresse était écrite en littéral dans AdminController : donnée
# personnelle dans le dépôt, et destination impossible à changer sans
# recompiler.
security:
  critical-alert:
    email: ${SECURITY_CRITICAL_ALERT_EMAIL}

# ==========================================================
# URL PUBLIQUE DU PORTAIL
# ==========================================================
# Sert à construire les liens envoyés par courriel. Était figée sur
# localhost:8081, donc les liens étaient inutilisables hors poste de
# développement.
app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8081}

# ==========================================================
# CLES DE SIGNATURE JWT
# ==========================================================
# La cle privee signe TOUS les jetons de la plateforme.
#
# Elle etait auparavant chargee depuis classpath:keys/dev_private.pem,
# donc empaquetee dans le JAR livre : quiconque disposait de l'artefact
# pouvait l'extraire et forger n'importe quel jeton, pour n'importe quel
# role. Le chargement depuis le classpath est desormais refuse.
#
# Aucune valeur par defaut : sans cle, le service refuse de demarrer.
jwt:
  dev:
    private-key: ${JWT_DEV_PRIVATE_KEY:}
    public-key: ${JWT_DEV_PUBLIC_KEY:}
    private-key-path: ${JWT_DEV_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_DEV_PUBLIC_KEY_PATH:}
    key:
      # Poste de developpement uniquement. Une paire ephemere change a
      # chaque redemarrage et differe d'une instance a l'autre.
      allow-ephemeral: ${JWT_DEV_KEY_ALLOW_EPHEMERAL:false}
