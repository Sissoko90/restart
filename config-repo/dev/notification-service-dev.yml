# ==========================================
# NOTIFICATION SERVICE - Configuration DEV
# ==========================================
#
# CE FICHIER A ETE REECRIT. Le precedent etait un gabarit venu d'une autre
# architecture que celle de ce depot, et le suivre aurait reintroduit ce que la
# plateforme a elimine :
#
#   driver-class-name: com.mysql.cj.jdbc.Driver   -> la plateforme est PostgreSQL
#   spring.jpa + MySQLDialect                     -> JPA est BLOQUANT, et la
#                                                    politique du depot est zero
#                                                    blocage sur le chemin
#                                                    requete, verifiee par
#                                                    BlockHound
#   ddl-auto: update                              -> le schema vient de Flyway ;
#                                                    laisser Hibernate le
#                                                    modifier retire toute trace
#                                                    de ce qui a change
#   show-sql: true                                -> chaque requete journalisee
#   spring.json.trusted.packages: "*"             -> voir plus bas
#   noreply@dev.microservices.com                 -> reste de gabarit, ce n'est
#                                                    pas un domaine de ce projet
#   from-number: +1234567890                      -> valeur bouchon
#
# Rien de tout cela n'etait actif : le module n'etait pas dans le reacteur,
# personne ne le compilait. Mais c'etait la premiere chose qu'aurait lue
# quiconque reprenait ce service.

server:
  port: 8086

spring:
  application:
    name: notification-service

  # ==========================================
  # PERSISTANCE : R2DBC pour le service, JDBC pour les migrations
  # ==========================================
  # Meme forme qu'auth-service, user-service, interface-service et
  # setting-service. R2DBC est le pilote reactif utilise a chaque requete ;
  # Flyway ouvre une connexion JDBC au DEMARRAGE seulement, donc il ne touche
  # pas le chemin requete.
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME_NOTIFICATION:notification_service_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 5
      max-size: 10
      max-idle-time: 30m
      validation-query: SELECT 1

  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME_NOTIFICATION:notification_service_db}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    baseline-on-migrate: true
    locations: classpath:db/migration

  # ==========================================
  # KAFKA : ce service est d'abord un CONSOMMATEUR
  # ==========================================
  # Seuls `bootstrap-servers`, `group-id` et `auto-offset-reset` sont lus ici :
  # le consommateur reactif construit ses proprietes en code
  # (ReactiveKafkaConsumerConfig) et deserialise en String avant de parser avec
  # Jackson.
  #
  # Les `key-deserializer` / `value-deserializer` du fichier precedent sont donc
  # RETIRES : ils decrivaient un consommateur @KafkaListener que ce module n'a
  # pas. Avec eux, qui lisait ce fichier croyait que le JsonDeserializer de
  # Spring etait a l'oeuvre.
  #
  # `spring.json.trusted.packages: "*"` est retire pour la meme raison, et il
  # merite d'etre nomme : il autorise la deserialisation de N'IMPORTE QUELLE
  # classe presente au classpath a partir d'un message du bus. Il est inerte ici
  # — rien ne le lit — mais il est encore pose dans application-dev.yml, donc
  # commun a tous les services. Qui ajouterait un JsonDeserializer en heriterait
  # sans le savoir.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest

  # ==========================================
  # SMTP
  # ==========================================
  # Le port 1025 par defaut est celui de MailHog / Mailpit : en developpement, le
  # courriel est capture et non remis. C'est voulu — un envoi reel depuis un
  # poste de developpement atteindrait de vraies adresses.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
          # Un envoi SMTP qui n'expire jamais retient un thread de
          # boundedElastic indefiniment. Trois delais, parce que SMTP a trois
          # phases et qu'un seul d'entre eux ne couvre pas les deux autres.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Autorite JWT = interface-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8088}
          jwk-set-uri: ${JWKS_URL:http://localhost:8088/dev/.well-known/jwks.json}

# ==========================================
# CANAUX DE NOTIFICATION
# ==========================================
notification:
  email:
    # VIDE par defaut, et non une adresse inventee.
    #
    # Le fichier precedent posait noreply@dev.microservices.com — un domaine
    # etranger a ce projet. Une valeur par defaut plausible mais fausse est pire
    # qu'une valeur absente : elle fait croire que la configuration est faite, et
    # les courriels partent avec une adresse d'expediteur qui n'existe pas, donc
    # se font rejeter par les serveurs destinataires.
    #
    # Le demarrage n'est PAS bloque, conformement a la politique du projet : le
    # service refuse d'envoyer et le dit, plutot que de ne pas demarrer.
    from: ${NOTIFICATION_EMAIL_FROM:}
    reply-to: ${NOTIFICATION_EMAIL_REPLY_TO:}

  # Les deux canaux ci-dessous ne sont PAS implementes a ce stade, et la
  # configuration le dit au lieu de le laisser croire. `provider: mock` sans
  # implementation derriere ressemblait a un canal fonctionnel en mode simule.
  sms:
    enabled: false
  push:
    enabled: false

# ==========================================
# OBSERVABILITE
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: notification-service

# ==========================================================
# SMS — les deux fournisseurs
# ==========================================================
#
# Ce bloc arrive d'auth-service-dev.yml avec le code qu'il configure.
# Le laisser la-bas aurait donne deux declarations pour un seul
# sous-systeme, dont une que plus aucune ligne de Java ne lit.
#
# `sms.enabled` N'EST PAS ici : il est declare une seule fois dans
# application-dev.yml, car auth-service le lit aussi — non pour envoyer,
# mais pour formuler sa reponse (« code envoye » / « code genere sans
# envoi »). Deux declarations d'une meme valeur finissent par diverger.
# Note: Les credentials SMS sont chargés depuis .env via DotenvConfig.
#
# Deux fournisseurs sont implémentés, et SMS_PROVIDER désigne celui qui sert,
# sans recompilation :
#   afriksms (défaut) -- réactif, par WebClient
#   twilio            -- conservé, SDK bloquant isolé sur boundedElastic
#
# Deux réglages, et ils ne disent pas la même chose :
#   sms.enabled   coupe TOUT envoi, quel que soit le fournisseur
#   sms.provider  désigne le fournisseur qui sert ; l'autre ne sert pas
#
# C'est donc sms.provider qui désactive un fournisseur. Pas d'interrupteur par
# fournisseur en plus : il ferait double emploi, et les deux pourraient se
# contredire.
#
# Un SMS_PROVIDER inconnu empêche notification-service de démarrer, avec la liste
# des valeurs acceptées : le fournisseur est sur le chemin de l'inscription, et une
# faute de frappe ne doit pas se traduire par des SMS qui cessent de partir en
# silence.
#
# Toutes les autres valeurs portent un défaut : une variable absente ne doit pas
# empêcher le service de démarrer, elle doit produire un avertissement explicite
# au démarrage (voir SmsServiceImpl.verifierLaConfiguration).
sms:
  provider: ${SMS_PROVIDER:afriksms}

  # AUCUN reessai d'envoi, et c'est un choix.
  #
  # Un SMS remis au fournisseur se paie. Un reessai dont on ne sait pas si le
  # premier envoi est parti fait payer deux fois et peut livrer le message en
  # double. Une tentative, un credit, un message.
  #
  # Un echec n'est pas perdu pour autant : l'utilisateur peut redemander un
  # code, ce qui est un reessai decide par une personne plutot que par une
  # boucle.

  # --- Deux garde-fous de depense ---

  # PRODUCTION : nombre maximal d'envois ACCEPTES par jour.
  #
  # Le trou que ce plafond ferme : la surveillance du solde ci-dessous tourne
  # UNE FOIS PAR JOUR. Entre deux releves, rien ne surveille la depense — et un
  # credit epuise ne produit aucune erreur HTTP, l'envoi repond 200 avec un code
  # de refus. Une boucle fautive peut donc vider le solde en quelques minutes,
  # et le premier signe visible serait des utilisateurs sans code.
  #
  # Ce plafond transforme « le solde a disparu » en « N SMS depenses, puis des
  # refus, avec une trace en ERROR ».
  #
  # 0 desactive le plafond, avec un avertissement au demarrage.
  plafond-journalier: ${SMS_PLAFOND_JOURNALIER:500}

  # DEVELOPPEMENT : les seuls numeros qui recoivent reellement.
  #
  # VIDE par defaut = aucun filtrage, et c'est voulu : si une liste vide coupait
  # les envois, ajouter ce garde-fou aurait suffi a casser tous les codes de
  # verification sans que personne ne change de configuration.
  #
  # Renseignee, elle rend impossible d'envoyer ailleurs : un numero absent est
  # journalise et jete, sans appel au fournisseur, donc sans credit. C'est ce
  # qu'il faut pour essayer un envoi reel sans risquer d'ecrire a des personnes
  # reelles — ce que `sms.enabled` ne permet pas, etant tout ou rien.
  #
  # Plusieurs numeros separes par des virgules. La comparaison porte sur le
  # numero NORMALISE : +223 70 00 00 00 et 22370000000 sont le meme.
  numeros-autorises: ${SMS_NUMEROS_AUTORISES:}

  afriksms:
    # Aucune URL n'est écrite dans le code : les trois appartiennent à la
    # configuration. Les trois points d'entrée d'AfrikSMS sont déclarés
    # séparément plutôt que dérivés d'une base, pour qu'aucun chemin d'API ne
    # vive dans le code Java.
    url: ${SMS_AFRIKSMS_URL:https://api.afriksms.com/api/web/web_v1/outbounds/send}
    callback-url: ${SMS_AFRIKSMS_CALLBACK_URL:https://api.afriksms.com/api/web/web_v1/outbounds/callback_url}
    balance-url: ${SMS_AFRIKSMS_BALANCE_URL:https://api.afriksms.com/api/web/web_v1/outbounds/solde}
    client-id: ${SMS_AFRIKSMS_CLIENT_ID:}
    api-key: ${SMS_AFRIKSMS_API_KEY:}
    # 11 caractères au maximum, imposé par AfrikSMS. Au-delà, tronqué avec un
    # avertissement au démarrage.
    sender-id: ${SMS_AFRIKSMS_SENDER_ID:}
    timeout-seconds: ${SMS_AFRIKSMS_TIMEOUT_SECONDS:10}

    # --- Accusés de réception (delivery receipts) ---
    #
    # notify-url est l'URL que POST /admin/sms/url-de-rappel déclare chez
    # AfrikSMS. Elle vient d'ICI et non du corps de la requête admin : accepter
    # une URL arbitraire permettrait de rediriger nos accusés vers un serveur
    # quelconque.
    #
    # Elle doit pointer sur le Gateway, pas sur auth-service : celui-ci n'accepte
    # que des requêtes signées venant du Gateway.
    #
    # notify-secret est le seul moyen d'authentifier AfrikSMS, qui ne signe rien
    # et n'envoie aucun en-tête de notre choix. Vide, TOUS les accusés sont
    # refusés — c'est voulu : un défaut utilisable laisserait le point d'entrée
    # ouvert là où personne n'a renseigné la variable.
    #
    # notify-type : 1 = POST, 2 = GET. Les deux formes sont acceptées à la
    # réception, quelle que soit la valeur déclarée.
    notify-url: ${SMS_AFRIKSMS_NOTIFY_URL:}
    notify-secret: ${SMS_AFRIKSMS_NOTIFY_SECRET:}
    notify-type: ${SMS_AFRIKSMS_NOTIFY_TYPE:1}

  # Surveillance du solde chez le fournisseur.
  #
  # Un credit epuise ne produit AUCUNE erreur HTTP : l'envoi repond 200 avec un
  # code de refus. Sans ce releve, la panne se manifeste seulement par des
  # utilisateurs qui ne recoivent plus leur code.
  #
  # Deux seuils : solde <= 0 est un incident (ERROR, les SMS ne partent plus),
  # solde <= seuil-alerte est un avertissement (WARN, il reste du temps pour
  # recharger).
  #
  # Propre a AfrikSMS : la tache ne fait rien si sms.provider designe Twilio, ni
  # si sms.enabled est faux.
  solde:
    surveillance:
      enabled: ${SMS_SOLDE_SURVEILLANCE_ENABLED:true}
      # Une fois par jour. Repetee toutes les heures, l'alerte cesserait d'etre lue.
      cron: ${SMS_SOLDE_SURVEILLANCE_CRON:0 0 8 * * *}
      seuil-alerte: ${SMS_SOLDE_SEUIL_ALERTE:100}

  # Durée de conservation de la correspondance resourceId -> numéro, qui rend
  # les accusés de réception interprétables. Courte par nature : un accusé
  # arrive en quelques minutes.
  registre:
    duree-de-vie-heures: ${SMS_REGISTRE_DUREE_HEURES:48}

  twilio:
    # Conservé et complet, mais inactif tant que sms.provider ne le désigne pas.
    account-sid: ${SMS_ACCOUNT_SID:}
    auth-token: ${SMS_AUTH_TOKEN:}
    sender-id: ${SMS_SENDER_ID:}

