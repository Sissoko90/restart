# ==========================================
# NOTIFICATION SERVICE - Configuration DEV
# ==========================================
#
# CE FICHIER A ETE REECRIT. Le precedent etait un gabarit venu d'une autre
# architecture que celle de ce depot, et le suivre aurait reintroduit ce que la
# plateforme a elimine :
#
#   driver-class-name: com.mysql.cj.jdbc.Driver   -> la plateforme est PostgreSQL
#   spring.jpa + MySQLDialect                     -> JPA est BLOQUANT, et la
#                                                    politique du depot est zero
#                                                    blocage sur le chemin
#                                                    requete, verifiee par
#                                                    BlockHound
#   ddl-auto: update                              -> le schema vient de Flyway ;
#                                                    laisser Hibernate le
#                                                    modifier retire toute trace
#                                                    de ce qui a change
#   show-sql: true                                -> chaque requete journalisee
#   spring.json.trusted.packages: "*"             -> voir plus bas
#   noreply@dev.microservices.com                 -> reste de gabarit, ce n'est
#                                                    pas un domaine de ce projet
#   from-number: +1234567890                      -> valeur bouchon
#
# Rien de tout cela n'etait actif : le module n'etait pas dans le reacteur,
# personne ne le compilait. Mais c'etait la premiere chose qu'aurait lue
# quiconque reprenait ce service.

server:
  port: 8086

spring:
  application:
    name: notification-service

  # ==========================================
  # PERSISTANCE : R2DBC pour le service, JDBC pour les migrations
  # ==========================================
  # Meme forme qu'auth-service, user-service, interface-service et
  # setting-service. R2DBC est le pilote reactif utilise a chaque requete ;
  # Flyway ouvre une connexion JDBC au DEMARRAGE seulement, donc il ne touche
  # pas le chemin requete.
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME_NOTIFICATION:notification_service_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 5
      max-size: 10
      max-idle-time: 30m
      validation-query: SELECT 1

  # Consul : la sonde interrogee est `readiness`, et non `/actuator/health`.
  #
  # Le defaut global de application-dev.yml est `/actuator/health`, qui agrege
  # TOUS les indicateurs — dont `consul` et `clientConfigServer`. Avec
  # `query-passing: true`, un hoquet du serveur de configuration suffirait a
  # faire cesser le routage vers ce service.
  #
  # Le groupe `readiness` est defini plus bas, sous
  # `management.endpoint.health.group`, avec le detail de ce qui y entre et de
  # ce qui en reste dehors.
  cloud:
    consul:
      discovery:
        health-check-path: /actuator/health/readiness

  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME_NOTIFICATION:notification_service_db}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    # FAUX : plus rien n'a a etre adopte.
    #
    # A `true` sans `baseline-version`, Flyway qui trouve un schema non vide
    # sans historique inscrit « version 1 deja passee » et SAUTE V1. Mesure le
    # 2026-11-10 sur user_service_db : six tables, aucun historique — V1 aurait
    # ete declaree appliquee, et deux de ses quatre tables n'auraient jamais
    # existe. Le service aurait demarre sans se plaindre.
    #
    # A `false`, Flyway refuse un schema non vide sans historique, et le dit.
    baseline-on-migrate: false
    locations: classpath:db/migration

  # ==========================================
  # KAFKA : ce service est d'abord un CONSOMMATEUR
  # ==========================================
  # Seuls `bootstrap-servers`, `group-id` et `auto-offset-reset` sont lus ici :
  # le consommateur reactif construit ses proprietes en code
  # (ReactiveKafkaConsumerConfig) et deserialise en String avant de parser avec
  # Jackson.
  #
  # Les `key-deserializer` / `value-deserializer` du fichier precedent sont donc
  # RETIRES : ils decrivaient un consommateur @KafkaListener que ce module n'a
  # pas. Avec eux, qui lisait ce fichier croyait que le JsonDeserializer de
  # Spring etait a l'oeuvre.
  #
  # `spring.json.trusted.packages: "*"` est retire pour la meme raison, et il
  # merite d'etre nomme : il autorise la deserialisation de N'IMPORTE QUELLE
  # classe presente au classpath a partir d'un message du bus. Il est inerte ici
  # — rien ne le lit — mais il est encore pose dans application-dev.yml, donc
  # commun a tous les services. Qui ajouterait un JsonDeserializer en heriterait
  # sans le savoir.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest

  # ==========================================
  # SMTP
  # ==========================================
  # Le port 1025 par defaut est celui de MailHog / Mailpit : en developpement, le
  # courriel est capture et non remis. C'est voulu — un envoi reel depuis un
  # poste de developpement atteindrait de vraies adresses.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
          # Un envoi SMTP qui n'expire jamais retient un thread de
          # boundedElastic indefiniment. Trois delais, parce que SMTP a trois
          # phases et qu'un seul d'entre eux ne couvre pas les deux autres.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Autorite JWT = interface-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8088}
          jwk-set-uri: ${JWKS_URL:http://localhost:8088/dev/.well-known/jwks.json}

# ==========================================
# CANAUX DE NOTIFICATION
# ==========================================
notification:
  # ==========================================================
  # ENVOI DEPUIS L'ADMINISTRATION
  # ==========================================================
  # Les deux endpoints de AdminEnvoiController : une personne, ou un groupe.
  admin:
    # Plafond de destinataires par appel.
    #
    # Il ne protege pas d'une faute de frappe — il rend visible le moment ou
    # cet endpoint cesse d'etre un outil d'exploitation pour devenir un envoi
    # de masse. Chaque destinataire coute une resolution de coordonnees chez
    # user-service puis une remise par canal ; mille destinataires occuperaient
    # le service pendant des minutes, et les codes de verification arrives
    # entre-temps attendraient derriere.
    #
    # Un envoi de masse demande son propre service, avec sa propre file, son
    # propre consentement et son lien de desabonnement.
    plafond-groupe: ${NOTIFICATION_ADMIN_PLAFOND_GROUPE:200}

    # Destinataires traites simultanement.
    #
    # Borne, et non un flatMap nu : sans borne, cinq cents resolutions de
    # coordonnees partiraient d'un coup vers user-service, dont le disjoncteur
    # s'ouvrirait — et les notifications ordinaires du bus echoueraient avec
    # elles.
    concurrence: ${NOTIFICATION_ADMIN_CONCURRENCE:4}
  # ==========================================================
  # Consentement par canal : ce qui s'applique quand la personne n'a RIEN dit
  # ==========================================================
  #
  # Le consentement lui-meme vit dans setting-service, magasin par utilisateur,
  # sous les cles `notifications.canal.<canal>`. Lu par
  # GET /internal/settings/users/{sub}, en un seul appel pour tous les canaux.
  #
  # Ces valeurs-ci ne sont QUE le defaut, pour la quasi-totalite des comptes qui
  # n'a jamais regle ses preferences. Elles different par canal parce que ces
  # canaux ne se valent pas :
  #
  #   COURRIEL accorde : c'est par lui qu'on confirme une inscription et qu'on
  #     previent d'un changement de mot de passe. Le refuser par defaut rendrait
  #     la plateforme inutilisable — et personne ne pourrait l'accepter, puisque
  #     l'invitation a le faire passerait par lui.
  #
  #   SMS et PUSH refuses : un SMS se paie et arrive sur le telephone de la
  #     personne, un push s'affiche sur son ecran. Ce sont des canaux qu'on
  #     demande, pas qu'on impose. Et dans le doute, ne pas envoyer est
  #     reparable ; envoyer ne l'est pas.
  #
  # IN_APP et WEBSOCKET ne figurent pas ici : ils remettent dans la propre boite
  # de reception de la personne, sur sa propre session. Demander la permission
  # de lui montrer ses messages dans son interface n'aurait pas de sens.
  #
  # Modifiable A CHAUD : une campagne qui justifierait d'ouvrir le SMS par
  # defaut ne demande pas un redeploiement.
  consentement:
    defaut:
      courriel: ${NOTIFICATION_CONSENTEMENT_COURRIEL:true}
      sms: ${NOTIFICATION_CONSENTEMENT_SMS:false}
      push: ${NOTIFICATION_CONSENTEMENT_PUSH:false}

  reprise:
    # Nombre total de tentatives par canal, premiere incluse.
    tentatives-max: ${NOTIFICATION_REPRISE_TENTATIVES_MAX:3}

    # Age minimal d'un echec avant de le rejouer.
    #
    # Pas zero : reprendre immediatement reessaierait pendant la panne meme qui
    # a cause l'echec, epuiserait le plafond en quelques secondes, et n'aurait
    # plus rien a jouer au moment ou le service revient.
    delai-minutes: ${NOTIFICATION_REPRISE_DELAI_MINUTES:5}

    # Taille du lot. Une file de dix mille echecs ne doit pas produire dix mille
    # remises d'un coup, ce qui ferait tomber le serveur SMTP qu'on menage.
    taille-du-lot: ${NOTIFICATION_REPRISE_TAILLE_LOT:50}

    # fixedDelay : l'intervalle court apres la FIN de la passe precedente, pour
    # que deux passes ne selectionnent jamais les memes lignes.
    intervalle-secondes: ${NOTIFICATION_REPRISE_INTERVALLE:120}
    # Laisse le temps au service de finir de demarrer avant la premiere passe.
    delai-initial-secondes: ${NOTIFICATION_REPRISE_DELAI_INITIAL:60}

  modeles:
    # Intervalle de relecture de la table surcharge_de_modele.
    #
    # LE SEUL mecanisme de convergence des textes. Les modeles vivent dans
    # modeles-notification.properties, livre avec le code ; la table ne porte
    # que les corrections posees a chaud par /api/v1/admin/modeles, et le
    # moteur en tient un instantane en memoire.
    #
    # POURQUOI UN INSTANTANE ET NON UNE LECTURE PAR RENDU : le rendu est appele
    # une fois par canal dans le chemin de remise, et une fois par notification
    # dans la boite de reception. Une lecture en base a chaque rendu ferait donc
    # une requete par notification affichee — le defaut N+1, sur l'ecran le plus
    # consulte du service.
    #
    # Une ecriture par l'API recharge immediatement l'instance qui l'a recue, de
    # sorte que l'exploitant constate son changement tout de suite. Cet
    # intervalle est ce qui amene les AUTRES instances a la meme valeur, sans
    # qu'il faille agir sur chacune.
    #
    # Pas modifiable a chaud, et c'est une consequence assumee : une tache
    # @Scheduled est enregistree une seule fois au demarrage, donc la classe qui
    # la porte ne peut pas etre @RefreshScope — elle cesserait de s'executer.
    # Le CONTENU des modeles, lui, est bien modifiable a chaud : c'est le besoin.
    rechargement-ms: ${NOTIFICATION_MODELES_RECHARGEMENT_MS:60000}

  email:
    # Le logo integre au corps HTML des courriels.
    #
    # Les gabarits de modeles-html/ y font reference par `cid:logo`. Si cette
    # valeur est vide, ou si la ressource est illisible, le courriel part SANS
    # image : refuser l'envoi d'un code de verification pour un logo serait
    # disproportionne. L'echec est journalise en WARN, parce qu'une image
    # absente sur tous les courriels se remarque tard.
    #
    # Le protocole de ressources de Spring tranche : `classpath:` pour l'image
    # livree avec le service, un chemin absolu pour la remplacer sans
    # reconstruire.
    logo-integre: ${NOTIFICATION_EMAIL_LOGO:classpath:assets/logo.png}
    # --- Second compte SMTP, pour les notifications CRITIQUES ---
    #
    # Alertes de securite et codes de verification. Un compte dedie garde leur
    # reputation d'expedition separee de celle du trafic ordinaire : un courriel
    # marque indesirable parce qu'une campagne a sature le compte commun est un
    # code que personne ne recoit.
    #
    # Chaque valeur RETOMBE sur celle du compte ordinaire (spring.mail.*) quand
    # elle n'est pas renseignee. Un second compte ameliore la remise, il n'en
    # est pas la condition — sans ce repli, ne pas le configurer aurait coupe
    # les alertes de securite, c'est-a-dire exactement celles qui doivent
    # arriver.
    #
    # Les deux comptes sont declares EXPLICITEMENT en Java, et c'est
    # obligatoire : MailSenderAutoConfiguration recule des qu'un JavaMailSender
    # existe. interface-service l'a paye — un de ses trois comptes etait
    # configure et jamais utilise.
    # Le repli est ECRIT ICI, et non en defaut de @Value cote Java.
    #
    # La raison est une regle de Spring qu'on oublie : un defaut de @Value ne
    # s'applique que si la propriete est ABSENTE. Declarer
    # `port: ${NOTIFICATION_EMAIL_CRITIQUE_PORT:}` rend une chaine VIDE, donc la
    # propriete existe, donc le defaut imbrique cote Java n'est jamais consulte
    # — et `@Value("${...port:587}")` sur un int leve NumberFormatException au
    # demarrage. Ce depot a deja paye cette regle sur un prefixe de cle Redis.
    critique:
      host: ${NOTIFICATION_EMAIL_CRITIQUE_HOST:${SMTP_HOST:localhost}}
      port: ${NOTIFICATION_EMAIL_CRITIQUE_PORT:${SMTP_PORT:1025}}
      username: ${NOTIFICATION_EMAIL_CRITIQUE_USERNAME:${SMTP_USERNAME:}}
      password: ${NOTIFICATION_EMAIL_CRITIQUE_PASSWORD:${SMTP_PASSWORD:}}

    # VIDE par defaut, et non une adresse inventee.
    #
    # Le fichier precedent posait noreply@dev.microservices.com — un domaine
    # etranger a ce projet. Une valeur par defaut plausible mais fausse est pire
    # qu'une valeur absente : elle fait croire que la configuration est faite, et
    # les courriels partent avec une adresse d'expediteur qui n'existe pas, donc
    # se font rejeter par les serveurs destinataires.
    #
    # Le demarrage n'est PAS bloque, conformement a la politique du projet : le
    # service refuse d'envoyer et le dit, plutot que de ne pas demarrer.
    from: ${NOTIFICATION_EMAIL_FROM:}
    reply-to: ${NOTIFICATION_EMAIL_REPLY_TO:}

  # Les deux canaux ci-dessous ne sont PAS implementes a ce stade, et la
  # configuration le dit au lieu de le laisser croire. `provider: mock` sans
  # implementation derriere ressemblait a un canal fonctionnel en mode simule.
  # `notification.sms.enabled` a ete RETIRE : c'etait un SECOND interrupteur
  # pour « le SMS est-il actif ». CanalSms le lisait, l'expediteur reel lit
  # `sms.enabled` (declare dans application-dev.yml, car auth-service le lit
  # aussi). Deux reglages pour une question, qui pouvaient se contredire.
  #
  # L'etat du canal est desormais celui de l'expediteur, par envoiActif().
  push:
    # Interrupteur d'EXPLOITATION, distinct de la présence des identifiants.
    #
    # Les deux conditions sont nécessaires, et elles disent des choses
    # différentes : `enabled` est un CHOIX — couper le push sur un
    # environnement — et le compte de service présent est un FAIT. Un seul
    # réglage pour les deux empêcherait de distinguer « on ne veut pas » de
    # « on ne peut pas », et ce dépôt a déjà payé deux interrupteurs pour une
    # même question du côté SMS.
    #
    # Faux par défaut : un canal qui répond « remis » sans rien envoyer est un
    # faux succès.
    enabled: ${NOTIFICATION_PUSH_ENABLED:false}

    firebase:
      # Le chemin du compte de service Firebase. HORS DU DÉPÔT.
      #
      # POURQUOI UN CHEMIN ET NON LE CONTENU. Ce fichier JSON porte une CLÉ
      # PRIVÉE RSA qui autorise à pousser vers TOUS les appareils de
      # l'application et à signer pour l'ensemble du projet Google. C'est un
      # secret du même ordre que la clé de signature des JWT.
      #
      # Une variable d'environnement portant le JSON entier finirait dans un
      # vidage mémoire, dans la sortie de `/actuator/env` et dans tout
      # diagnostic de configuration. Un fichier commité, même chiffré, finirait
      # dans l'historique. Un chemin, lui, ne révèle rien par lui-même.
      #
      # VIDE PAR DÉFAUT, et le démarrage n'est PAS bloqué — politique du dépôt.
      # Sans valeur, ConfigurationFirebase journalise ce qui manque et le canal
      # PUSH se déclare inactif.
      #
      # Emplacement recommandé, hors de l'arborescence du dépôt :
      #   ~/.restart/firebase-service-account.json   (droits 600)
      credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

    # Retrait des appareils qui ne se manifestent plus.
    #
    # FCM ne signale un jeton mort qu'à l'ENVOI : une personne qui ne reçoit
    # aucune notification garderait son jeton périmé indéfiniment.
    #
    # Six mois, et c'est délibérément généreux. Purger trop tôt couperait les
    # alertes de sécurité de quelqu'un qui ouvre son application tous les deux
    # mois ; purger trop tard ne coûte qu'une ligne en base. Le jeton est de
    # toute façon réenregistré dès la première ouverture suivante.
    purge-apres-jours: ${NOTIFICATION_PUSH_PURGE_JOURS:180}

    # fixedDelay : l'intervalle court après la FIN de la passe précédente, donc
    # deux passes ne peuvent pas se chevaucher. Une fois par jour.
    purge-intervalle-ms: ${NOTIFICATION_PUSH_PURGE_INTERVALLE_MS:86400000}
    # Laisse le temps au service de finir de démarrer avant la première passe.
    purge-delai-initial-ms: ${NOTIFICATION_PUSH_PURGE_DELAI_INITIAL_MS:120000}

# ==========================================
# OBSERVABILITE
# ==========================================
management:
  endpoints:
    web:
      exposure:
        # `refresh` : recharge la configuration sans redemarrer.
        #
        # L'endpoint existait deja — spring-cloud-context l'apporte avec
        # spring-cloud-starter-config — et n'etait expose par AUCUN module du
        # depot. Changer une valeur ici n'avait donc aucun effet avant le
        # prochain redemarrage, et rien ne le disait.
        #
        # Reserve au role ADMIN par SecurityConfig, comme tout /actuator/**
        # hors sondes : le relire divulguerait la configuration, et l'appeler
        # est une action d'exploitation.
        #
        # Exposer l'endpoint ne suffit PAS : les beans doivent porter
        # @RefreshScope. Voir la classe RechargementAChaud.
        include: health,info,prometheus,refresh
  endpoint:
    health:
      show-details: when-authorized

      # LA SONDE QUE CONSUL INTERROGE, ET CE QU'ELLE CONTIENT.
      #
      # `spring.cloud.consul.discovery.health-check-path` pointe ci-dessous sur
      # `/actuator/health/readiness`, et non sur `/actuator/health`. Ce groupe
      # decide donc du TRAFIC : avec `query-passing: true`, une instance dont
      # ce controle echoue cesse d'etre annoncee a l'equilibreur.
      #
      # Ce qui est DEDANS, et pourquoi :
      #   diskSpace  un disque plein empeche d'ecrire la boite de reception ;
      #   r2dbc      la base porte la boite de reception, les jetons
      #              d'appareil et les surcharges de modeles. Sans elle, la
      #              quasi-totalite de la surface HTTP de ce service repond en
      #              erreur : il ne doit pas recevoir de trafic.
      #
      # Ce qui est DEHORS, et c'est le point important :
      #   redis      il porte le plafond de depense SMS, le registre des
      #              sessions WebSocket et les accuses de reception. Sans lui,
      #              le SMS s'arrete — mais le courriel, le push et la boite de
      #              reception fonctionnent. Retirer le service du routage
      #              aggraverait la panne au lieu de la contenir ;
      #   canauxDeRemise      un canal coupe est le plus souvent un CHOIX (SMS
      #              desactive en developpement, push sans fichier Firebase).
      #              La sante d'un canal SORTANT ne doit pas decider du trafic
      #              ENTRANT ;
      #   surchargesDeModeles un rechargement arrete n'empeche pas de remettre :
      #              le fichier versionne sert seul.
      #   consul, clientConfigServer   ils sont dans `/actuator/health` par
      #              autoconfiguration, et les mettre dans la sonde serait
      #              circulaire : un hoquet de Consul rendrait TOUS les
      #              services DOWN aux yeux de Consul.
      #
      # Les quatre exclus restent lisibles sur `/actuator/health`, et les
      # canaux sont de plus publies en jauge — `notification_canal_actif` —
      # donc visibles dans Grafana et interrogeables par une alerte. Un
      # indicateur de sante sert l'exploitant et Consul ; une metrique sert le
      # panneau et l'alerte. Les deux sont necessaires et ne se remplacent pas.
      group:
        readiness:
          include: diskSpace,r2dbc
  metrics:
    tags:
      application: notification-service

# ==========================================================
# SMS — les deux fournisseurs
# ==========================================================
#
# Ce bloc arrive d'auth-service-dev.yml avec le code qu'il configure.
# Le laisser la-bas aurait donne deux declarations pour un seul
# sous-systeme, dont une que plus aucune ligne de Java ne lit.
#
# `sms.enabled` N'EST PAS ici : il est declare une seule fois dans
# application-dev.yml, car auth-service le lit aussi — non pour envoyer,
# mais pour formuler sa reponse (« code envoye » / « code genere sans
# envoi »). Deux declarations d'une meme valeur finissent par diverger.
# Note: Les credentials SMS sont chargés depuis .env via DotenvConfig.
#
# Deux fournisseurs sont implémentés, et SMS_PROVIDER désigne celui qui sert,
# sans recompilation :
#   afriksms (défaut) -- réactif, par WebClient
#   twilio            -- conservé, SDK bloquant isolé sur boundedElastic
#
# Deux réglages, et ils ne disent pas la même chose :
#   sms.enabled   coupe TOUT envoi, quel que soit le fournisseur
#   sms.provider  désigne le fournisseur qui sert ; l'autre ne sert pas
#
# C'est donc sms.provider qui désactive un fournisseur. Pas d'interrupteur par
# fournisseur en plus : il ferait double emploi, et les deux pourraient se
# contredire.
#
# Un SMS_PROVIDER inconnu empêche notification-service de démarrer, avec la liste
# des valeurs acceptées : le fournisseur est sur le chemin de l'inscription, et une
# faute de frappe ne doit pas se traduire par des SMS qui cessent de partir en
# silence.
#
# Toutes les autres valeurs portent un défaut : une variable absente ne doit pas
# empêcher le service de démarrer, elle doit produire un avertissement explicite
# au démarrage (voir SmsServiceImpl.verifierLaConfiguration).
# ==========================================================
# Reprise des remises qui ont echoue
# ==========================================================
#
# `aReprendre` existait SANS AUCUN APPELANT : l'etat ECHOUE etait ecrit, le
# schema comptait meme les tentatives, et personne ne lisait rien. Un courriel
# perdu pendant une panne SMTP restait perdu.
#
# Le SMS est EXCLU de la reprise, en code et non par configuration : un SMS se
# paie, et un rejeu dont on ne sait pas si le premier envoi est parti fait payer
# deux fois. Voir RepriseDesRemises.
#
# REFUSE et SANS_DESTINATAIRE sont exclus par la requete : le premier est
# definitif (aucune adresse connue, modele introuvable), le second decrit un
# WebSocket sans session ouverte, c'est-a-dire le fonctionnement normal.
# ==========================================================
# user-service : ou joindre une personne
# ==========================================================
#
# Ce service ne detient AUCUN contact, et c'est voulu : une adresse recopiee ici
# serait une seconde verite, et un message partirait a l'ancienne apres un
# changement. Les coordonnees sont demandees a user-service, par
# GET /internal/users/auth/{sub} — un chemin que la passerelle ne route pas.
#
# Aucun cache local non plus : user-service sert cet appel depuis son propre
# cache Redis, invalide a chaque modification de profil. Un cache ici n'aurait
# aucun moyen d'etre invalide.
#
# Vide, les canaux COURRIEL, SMS et PUSH refusent toute remise et le demarrage
# le signale en ERROR. IN_APP et WEBSOCKET continuent de fonctionner : ils
# routent sur l'identifiant du porteur.
# setting-service : le consentement par personne.
#
# Vide, aucun consentement n'est lu et la politique de defaut ci-dessus
# s'applique a tout le monde — ce qui est un repli acceptable, et non une
# ouverture : le defaut du SMS et du push est le REFUS.
setting-service:
  url: ${SETTING_SERVICE_URL:http://localhost:8087}
  # Court : cet appel est sur le chemin de chaque notification a coordonnee, et
  # il est fait en PARALLELE de la lecture des coordonnees — le pire cas reste
  # donc trois secondes, pas six.
  timeout-seconds: ${SETTING_SERVICE_TIMEOUT_SECONDS:3}

user-service:
  url: ${USER_SERVICE_URL:http://localhost:8083}
  # Court : cet appel est sur le chemin de CHAQUE notification a coordonnee, et
  # user-service repond depuis son cache. Au-dela, la notification est marquee
  # ECHOUE — donc reprise plus tard, et non perdue.
  timeout-seconds: ${USER_SERVICE_TIMEOUT_SECONDS:3}

sms:
  provider: ${SMS_PROVIDER:afriksms}

  # AUCUN reessai d'envoi, et c'est un choix.
  #
  # Un SMS remis au fournisseur se paie. Un reessai dont on ne sait pas si le
  # premier envoi est parti fait payer deux fois et peut livrer le message en
  # double. Une tentative, un credit, un message.
  #
  # Un echec n'est pas perdu pour autant : l'utilisateur peut redemander un
  # code, ce qui est un reessai decide par une personne plutot que par une
  # boucle.

  # --- Deux garde-fous de depense ---

  # PRODUCTION : nombre maximal d'envois ACCEPTES par jour.
  #
  # Le trou que ce plafond ferme : la surveillance du solde ci-dessous tourne
  # UNE FOIS PAR JOUR. Entre deux releves, rien ne surveille la depense — et un
  # credit epuise ne produit aucune erreur HTTP, l'envoi repond 200 avec un code
  # de refus. Une boucle fautive peut donc vider le solde en quelques minutes,
  # et le premier signe visible serait des utilisateurs sans code.
  #
  # Ce plafond transforme « le solde a disparu » en « N SMS depenses, puis des
  # refus, avec une trace en ERROR ».
  #
  # 0 desactive le plafond, avec un avertissement au demarrage.
  plafond-journalier: ${SMS_PLAFOND_JOURNALIER:500}

  # DEVELOPPEMENT : les seuls numeros qui recoivent reellement.
  #
  # VIDE par defaut = aucun filtrage, et c'est voulu : si une liste vide coupait
  # les envois, ajouter ce garde-fou aurait suffi a casser tous les codes de
  # verification sans que personne ne change de configuration.
  #
  # Renseignee, elle rend impossible d'envoyer ailleurs : un numero absent est
  # journalise et jete, sans appel au fournisseur, donc sans credit. C'est ce
  # qu'il faut pour essayer un envoi reel sans risquer d'ecrire a des personnes
  # reelles — ce que `sms.enabled` ne permet pas, etant tout ou rien.
  #
  # Plusieurs numeros separes par des virgules. La comparaison porte sur le
  # numero NORMALISE : +223 70 00 00 00 et 22370000000 sont le meme.
  numeros-autorises: ${SMS_NUMEROS_AUTORISES:}

  afriksms:
    # Aucune URL n'est écrite dans le code : les trois appartiennent à la
    # configuration. Les trois points d'entrée d'AfrikSMS sont déclarés
    # séparément plutôt que dérivés d'une base, pour qu'aucun chemin d'API ne
    # vive dans le code Java.
    url: ${SMS_AFRIKSMS_URL:https://api.afriksms.com/api/web/web_v1/outbounds/send}
    callback-url: ${SMS_AFRIKSMS_CALLBACK_URL:https://api.afriksms.com/api/web/web_v1/outbounds/callback_url}
    balance-url: ${SMS_AFRIKSMS_BALANCE_URL:https://api.afriksms.com/api/web/web_v1/outbounds/solde}
    client-id: ${SMS_AFRIKSMS_CLIENT_ID:}
    api-key: ${SMS_AFRIKSMS_API_KEY:}
    # 11 caractères au maximum, imposé par AfrikSMS. Au-delà, tronqué avec un
    # avertissement au démarrage.
    sender-id: ${SMS_AFRIKSMS_SENDER_ID:}
    timeout-seconds: ${SMS_AFRIKSMS_TIMEOUT_SECONDS:10}

    # --- Accusés de réception (delivery receipts) ---
    #
    # notify-url est l'URL que POST /admin/sms/url-de-rappel déclare chez
    # AfrikSMS. Elle vient d'ICI et non du corps de la requête admin : accepter
    # une URL arbitraire permettrait de rediriger nos accusés vers un serveur
    # quelconque.
    #
    # Elle doit pointer sur le Gateway, pas sur auth-service : celui-ci n'accepte
    # que des requêtes signées venant du Gateway.
    #
    # notify-secret est le seul moyen d'authentifier AfrikSMS, qui ne signe rien
    # et n'envoie aucun en-tête de notre choix. Vide, TOUS les accusés sont
    # refusés — c'est voulu : un défaut utilisable laisserait le point d'entrée
    # ouvert là où personne n'a renseigné la variable.
    #
    # notify-type : 1 = POST, 2 = GET. Les deux formes sont acceptées à la
    # réception, quelle que soit la valeur déclarée.
    notify-url: ${SMS_AFRIKSMS_NOTIFY_URL:}
    notify-secret: ${SMS_AFRIKSMS_NOTIFY_SECRET:}
    notify-type: ${SMS_AFRIKSMS_NOTIFY_TYPE:1}

  # Surveillance du solde chez le fournisseur.
  #
  # Un credit epuise ne produit AUCUNE erreur HTTP : l'envoi repond 200 avec un
  # code de refus. Sans ce releve, la panne se manifeste seulement par des
  # utilisateurs qui ne recoivent plus leur code.
  #
  # Deux seuils : solde <= 0 est un incident (ERROR, les SMS ne partent plus),
  # solde <= seuil-alerte est un avertissement (WARN, il reste du temps pour
  # recharger).
  #
  # Propre a AfrikSMS : la tache ne fait rien si sms.provider designe Twilio, ni
  # si sms.enabled est faux.
  solde:
    surveillance:
      enabled: ${SMS_SOLDE_SURVEILLANCE_ENABLED:true}
      # Une fois par jour. Repetee toutes les heures, l'alerte cesserait d'etre lue.
      cron: ${SMS_SOLDE_SURVEILLANCE_CRON:0 0 8 * * *}
      seuil-alerte: ${SMS_SOLDE_SEUIL_ALERTE:100}

  # Durée de conservation de la correspondance resourceId -> numéro, qui rend
  # les accusés de réception interprétables. Courte par nature : un accusé
  # arrive en quelques minutes.
  registre:
    duree-de-vie-heures: ${SMS_REGISTRE_DUREE_HEURES:48}

  twilio:
    # Conservé et complet, mais inactif tant que sms.provider ne le désigne pas.
    account-sid: ${SMS_ACCOUNT_SID:}
    auth-token: ${SMS_AUTH_TOKEN:}
    sender-id: ${SMS_SENDER_ID:}

